# Project Validation Profile — ArcheAxis Knowledge
#
# Deterministic changed-path classifier input. Maps real paths to risk classes
# and a required Gate set. The classifier unions Gate sets across all matched
# classes. `full-qualification` is a logical stage/RC profile only and is NEVER
# triggered by ordinary or unknown changes (AXC-060): unknown paths run
# static + classification review and block merge until the profile is updated,
# without defaulting to NSIS/full matrix.
# This profile is the OS-local risk source of truth in standalone mode.

schema_version: "2.0"
project_id: "DTALEX66/ArcheAxis-Knowledge-OS"  # product = ArcheAxis Knowledge
controller_protocol: ">=1.0,<2.0"

modes:
  standalone: required
  managed: optional

fallback:
  unknown_change: unclassified-block  # static + primary + classification review; no full-qualification
  controller_unavailable: standalone
  invalid_evidence: unclassified-block

# Ordered path prefixes. First match wins for classification; Gate sets are
# then unioned across every matching risk class so mixed changes take the
# broadest required set.
risk_classes:
  - id: astryn-product-character-assets
    description: Owner-confirmed imported product character resources; same gates as formal frontend UI resources
    paths:
      - "assets/astryn/**"
    gates: [static, lint, browser-smoke]

  - id: astryn-preserved-donor-assets
    description: Exact retained ASTRYN full donor tree; static checks only, with no donor execution or qualification upgrade
    paths:
      - "assets/astryn-full/**"
    gates: [static, lint]

  - id: vnext-shared-vocabulary
    description: Single-source vocabulary and shared wire cases verify all three consumers
    paths:
      - "scripts/contracts/**"
      - "crates/archeaxis-contracts/src/generated/**"
      - "apps/ArcheAxis.Desktop/Contracts/Generated/**"
      - "services/python-workers/contracts/generated/**"
      - "tests/contract/fixtures/**"
    gates: [static, lint, rust-vnext, desktop-vnext, contracts-vnext]

  - id: vnext-desktop-contract-tests
    description: Headless C# contract test harness
    paths:
      - "tests/contract/Vocabulary.Tests/**"
    gates: [static, lint, desktop-vnext, contracts-vnext]

  - id: vnext-ci-policy
    description: vNext CI workflow, shared launcher or checker changes force every vNext lane
    paths:
      - ".github/workflows/vnext-ci.yml"
      - "scripts/ci/check_vnext_*.py"
      - "scripts/runtime/**"
      - "tests/runtime-paths/**"
      - "scripts/release/assemble_green_candidate.py"
      - "scripts/release/verify_green_candidate.py"
      - "scripts/release/backend_launcher.py"
      - "scripts/release/stage_backend_runtime.py"
      - "scripts/release/check_runtime_isolation.py"
    gates: [static, lint, rust-vnext, desktop-vnext, contracts-vnext, workers-vnext]

  - id: ci-desktop-build-policy
    description: Windows desktop build or installer lifecycle workflow changes
    paths:
      - ".github/workflows/ci.yml"
    gates: [static, lint, desktop-fast, desktop-build, installer-lifecycle]

  - id: release-workflow
    description: Release workflow/tag changes
    paths:
      - ".github/workflows/release.yml"
    gates: [release-verify]

  # Exact paths must precede generic ci-policy and vnext-contracts: the classifier
  # selects the first matching class for each path, not every matching class.
  - id: vnext-ai-asset-retest-contract
    description: Actual Core asset correction/retest contract retains both Rust and contract checks
    paths:
      - "tests/contract/test_ai_asset_formal_retest_real_core.py"
    gates: [static, lint, rust-vnext, contracts-vnext]

  - id: vnext-ai-asset-retest-helpers
    description: Helpers consumed by the actual Core asset correction/retest regression
    paths:
      - "scripts/ci/real_core_grading_journey.py"
      - "scripts/probes/aaos_ai_reference_observation_smoke.py"
    gates: [static, lint, rust-vnext]

  - id: ci-policy
    description: CI workflow, classifier, gate registry, release scripts, secret-scan policy
    paths:
      - ".github/**"
      - ".worklab/**"
      - ".project/**"
      - ".gitleaks.toml"
      - "scripts/ci/**"
      - "scripts/release_*.py"
    gates: [static, lint]

  - id: vnext-rust-core
    description: vNext Rust workspace (sole authoritative writer) or its lockfiles
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - "crates/**"
    gates: [static, lint, rust-vnext]

  - id: vnext-avalonia-desktop
    description: Frozen C#/Avalonia donor shell, supervisor, SDK pinning (donor under SUP-022, not the formal host)
    paths:
      - "apps/ArcheAxis.Desktop/**"
      - global.json
      - Directory.Packages.props
      - Directory.Build.props
    gates: [static, lint, desktop-vnext]

  - id: vnext-contracts
    description: vNext cross-language contract package and its tests
    paths:
      - "packages/contracts/**"
      - "tests/contract/**"
      - "crates/archeaxis-contracts/**"
      - "crates/archeaxis-sidecar-protocol/**"
    gates: [static, lint, contracts-vnext]

  - id: vnext-text-transport
    description: Text transport and parser changes verify the actual Rust process consumer
    paths:
      - "services/python-workers/transport/**"
      - "services/python-workers/document/worker_text.py"
      - "tests/workers/test_text_ndjson.py"
    gates: [static, lint, rust-vnext, workers-vnext]

  - id: learning-provider-runtime
    description: Consumed DeepTutor and OpenMAIC worker sources and version-pinned vendor slices; changes require Python, Rust and worker checks
    paths:
      # Exact entry points and the reviewed DeepTutor upstream slice.
      - services/learning-providers/deeptutor/LICENSE
      - services/learning-providers/deeptutor/candidate_document.py
      - services/learning-providers/deeptutor/candidate_readback.py
      - services/learning-providers/deeptutor/grade_worker.py
      - services/learning-providers/deeptutor/practice_171.py
      - services/learning-providers/deeptutor/practice_candidate_document.py
      - services/learning-providers/deeptutor/practice_candidate_readback.py
      - services/learning-providers/deeptutor/practice_host_worker.py
      - services/learning-providers/deeptutor/practice_import.py
      - services/learning-providers/deeptutor/question_normalizer.py
      - services/learning-providers/deeptutor/question_turn_worker.py
      - services/learning-providers/deeptutor/response_recovery.py
      - services/learning-providers/deeptutor/teaching_feedback_worker.py
      - "services/learning-providers/deeptutor/upstream/**"
      - "services/learning-providers/openmaic/upstream/**"
      # The generated staging closure: which adapters and vendor directories
      # travel beside the scene builder in an installation.
      - services/learning-providers/openmaic/RUNTIME-CLOSURE.json
      # Exact OpenMAIC worker and runner entry points.
      - services/learning-providers/openmaic/interactive-html-rewrite-probe.mjs
      - services/learning-providers/openmaic/interactive-html-rewrite-worker.mjs
      - services/learning-providers/openmaic/interactive-normalize-worker.mjs
      - services/learning-providers/openmaic/interactive-outline-worker.mjs
      - services/learning-providers/openmaic/interactive-prompt-worker.mjs
      - services/learning-providers/openmaic/interactive-url-map-worker.mjs
      - services/learning-providers/openmaic/interactive_html_rewrite_runner.py
      - services/learning-providers/openmaic/interactive_normalize_runner.py
      - services/learning-providers/openmaic/interactive_outline_runner.py
      - services/learning-providers/openmaic/interactive_prompt_runner.py
      - services/learning-providers/openmaic/local_model_relay.py
      - services/learning-providers/openmaic/outline-prompt-guard.mjs
      - services/learning-providers/openmaic/outline-replay-worker.mjs
      - services/learning-providers/openmaic/quiz-actions-replay-worker.mjs
      - services/learning-providers/openmaic/quiz-replay-worker.mjs
      - services/learning-providers/openmaic/scene-build-worker.mjs
      - services/learning-providers/openmaic/scene-contract-report.mjs
      - services/learning-providers/openmaic/slide-actions-replay-worker.mjs
      - services/learning-providers/openmaic/slide-normalize-worker.mjs
      - services/learning-providers/openmaic/slide-prompt-worker.mjs
      - services/learning-providers/openmaic/slide-reply-worker.mjs
      - services/learning-providers/openmaic/slide_normalize_runner.py
      - services/learning-providers/openmaic/slide_prompt_runner.py
      # Pin each retained vendor slice rather than accepting arbitrary new packages.
      - "services/learning-providers/openmaic/vendor/dsl-0.12.0-actions/**"
      - "services/learning-providers/openmaic/vendor/generation-0.3.28/**"
      - "services/learning-providers/openmaic/vendor/generation-0.3.28-outline/**"
      - "services/learning-providers/openmaic/vendor/generation-0.3.28-quiz/**"
      - "services/learning-providers/openmaic/vendor/generation-0.3.28-quiz-actions/**"
      - "services/learning-providers/openmaic/vendor/generation-0.3.28-slide-actions/**"
      - "services/learning-providers/openmaic/vendor/prompts-1.3.0-interactive-outline/**"
      - "services/learning-providers/openmaic/vendor/scene-content-0.3.28-original/**"
      - "services/learning-providers/openmaic/vendor/npm/commander-8.3.0/**"
      - "services/learning-providers/openmaic/vendor/npm/entities-6.0.1/**"
      - "services/learning-providers/openmaic/vendor/npm/entities-8.0.0/**"
      - "services/learning-providers/openmaic/vendor/npm/es-module-lexer-2.0.0/**"
      - "services/learning-providers/openmaic/vendor/npm/jsonrepair-3.13.3/**"
      - "services/learning-providers/openmaic/vendor/npm/nanoid-3.3.19/**"
      - "services/learning-providers/openmaic/vendor/npm/nanoid-5.1.14/**"
      - "services/learning-providers/openmaic/vendor/npm/parse5-8.0.1/**"
      - "services/learning-providers/openmaic/vendor/npm/partial-json-0.1.7/**"
      - "services/learning-providers/openmaic/vendor/npm/picocolors-1.1.1/**"
      - "services/learning-providers/openmaic/vendor/npm/postcss-8.5.23/**"
      - "services/learning-providers/openmaic/vendor/npm/postcss-value-parser-4.2.0/**"
      - "services/learning-providers/openmaic/vendor/npm/source-map-js-1.2.1/**"
      - "services/learning-providers/openmaic/vendor/npm/svg-pathdata-8.0.0/**"
      - "services/learning-providers/openmaic/vendor/npm/tinycolor2-1.6.0/**"
    gates: [static, lint, py-primary, rust-vnext, workers-vnext]

  - id: vnext-workers
    description: vNext isolated Python capability workers
    paths:
      - "services/python-workers/**"
      - "tests/workers/**"
      - "config/model-profiles/**"
    gates: [static, lint, workers-vnext]

  - id: vnext-journey-integration
    description: vNext journey / closed-loop integration test suites
    paths:
      - "tests/journey/**"
      - "tests/integration/closed-loop/**"
      - "tests/integration/research/**"
      - "tests/integration/learning/**"
      - "tests/integration/machine/**"
    gates: [static, lint, rust-vnext, desktop-vnext, workers-vnext]

  - id: vnext-authority-docs
    description: Contract/decision ledgers, receipts and vNext reference docs (no runtime semantics)
    paths:
      - PROJECT_CONTRACT.yaml
      - DECISION_SUPERSESSION_LEDGER.yaml
      - DIRECTORY_AUTHORITY.yaml
      - LEGACY_MANIFEST.yaml
      - AGENTS.md
      - "docs/authority/**"
      - "docs/design/**"
      - "workspace/intake/**"
      - "reports/vnext/**"
      - "reports/**"
    gates: [static]

  - id: contract-bearing-docs
    description: >-
      Documents that contract tests read and assert on. A docs path alone would
      only match docs-mechanical (static), so a contract edit could land without
      the tests that own it ever running - the failure mode that actually
      happened when a checkpoint document restated deleted-branch SHAs and broke
      test_axr060 under a docs-only change. Exact paths only: a broad docs glob
      would force the primary suite onto every prose change.
    paths:
      - docs/DOCUMENTATION_AUTHORITY_INDEX.md
      - docs/RUNTIME_DELIVERY_AUTHORITY_INDEX.md
      - docs/DIRECTORY_AUTHORITY_INDEX.md
      - docs/CONFIGURATION_AUTHORITY_INDEX.md
      - docs/LANGUAGE_BOUNDARY_AUTHORITY_INDEX.md
      - docs/history/repository-consolidation-20261019/legacy-docs/PROJECT_STATUS.md
      - docs/history/repository-consolidation-20261019/truth-snapshots/CURRENT_STATE_TRUTH.md
      # Files inside test_axr060's scanned surface: every 40-hex identifier in
      # them must resolve to a real object, and the authority index asserts
      # their local links resolve.
      - docs/history/repository-consolidation-20261019/current/AAOS-CLOUD-AUDIT-HANDOFF-20260926.md
      - docs/history/repository-consolidation-20261019/current/AAOS-DSH-TAKEOVER-CHECKPOINT-20260926.md
      - docs/history/branch-donors/README.md
    gates: [static, lint, py-primary]

  - id: security-permissions
    description: Permissions, secrets, SSRF, path/symlink boundaries
    paths:
      - scripts/check_architecture.py
      - scripts/check_repository_conventions.py
      - shared/approved_paths.py
      - shared/runtime_guard.py
    gates: [static, lint, security-targeted, py-primary]

  - id: db-migration
    description: Schema, migrations, data recovery
    paths:
      - "shared/*_migration.py"
      - shared/core_schema.py
      - shared/migration_runner.py
      - "**/migrations/**"
      - "migrations/**"
    gates: [static, lint, migration-targeted, py-primary]

  - id: rust-tauri-shell
    description: Formal Tauri host Rust logic under SUP-022; fast host gate without packaging inputs
    paths:
      - "src-tauri/src/*.rs"
      - "src-tauri/src/**/*.rs"
    gates: [desktop-fast]

  - id: formal-frontend-entry
    description: Formal React frontend document entry; verify the rendered browser shell
    paths:
      - frontend/index.html
    gates: [static, lint, browser-smoke]

  - id: formal-frontend-build-inputs
    description: Formal frontend dependency and TypeScript build inputs affect the browser, host build and installer
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/tsconfig.json
    gates: [static, lint, browser-smoke, desktop-fast, desktop-build, installer-lifecycle]

  - id: installer
    description: React/Tauri bundle and NSIS packaging lifecycle - the formal host installer under SUP-022, retained compatibility checks included
    paths:
      - "desktop/scripts/**"
      - frontend/vite.config.ts
      - "src-tauri/**"
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/build.rs
      - desktop/package.json
    gates: [desktop-fast, desktop-build, installer-lifecycle]

  - id: desktop-build
    description: Separate recovery Tauri build/config/resources compatibility
    paths:
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/build.rs
      - "desktop/src-tauri/icons/**"
    gates: [desktop-fast, desktop-build]

  - id: rust-tauri
    description: Recovery and shared Tauri Rust runtime, including code used by the formal host
    paths:
      - "desktop/src-tauri/**/*.rs"
    gates: [desktop-fast]

  - id: cargo-npm-deps
    description: Cargo/npm ecosystem dependencies
    paths:
      - desktop/src-tauri/Cargo.lock
      - desktop/package-lock.json
    gates: [desktop-fast]

  - id: wheel-packaging
    description: package-data, entry points, wheel config
    paths:
      - pyproject.toml
      - MANIFEST.in
      - app/release-manifest.json
    gates: [static, lint, wheel-smoke]

  - id: python-compat
    description: Legacy Python public contracts, dependency matrix and requirements compatibility
    paths:
      - pyproject.toml
      - requirements.txt
      - uv.lock
      - "shared-contracts/**"
    gates: [static, lint, py-compat, wheel-smoke]

  - id: dependency-change
    description: Lock/license-affecting dependency changes
    paths:
      - uv.lock
      - requirements.txt
    gates: [static, lint, wheel-smoke]

  - id: format-parser
    description: Format parsers / conversion engines that affect the installed wheel
    paths:
      - "app/ingestion/pdf.py"
      - "app/ingestion/multi_format.py"
      - "app/ingestion/*.py"
    gates: [static, lint, format-targeted, wheel-smoke]

  - id: windows-runtime
    description: Windows storage, migration, process, path handling
    paths:
      - "windows/**"
      - "shared/*windows*"
      - desktop/src-tauri/src/backend.rs
    gates: [static, lint, py-primary, windows-runtime]

  - id: ui
    description: UI resources, interaction, BFF/API consumed by UI
    paths:
      - "app/workspace/router.py"
      - "scripts/a0_browser_smoke.py"
      - "frontend/src/**"
      - "desktop/src/**/*.tsx"
      - "desktop/src/**/*.ts"
    gates: [static, lint, browser-smoke]

  - id: ordinary-python
    description: Ordinary Python backend business logic
    paths:
      - "app/**"
      - "shared/**"
      - "knowledge_base/**"
      - "inspiration_research/**"
      - "integration-tests/**"
      - "tests/**"
      - "scripts/check_*.py"
    gates: [static, lint, py-primary]

  - id: scripts-other
    description: Other repository tooling scripts (maintenance tools, pipeline drivers)
    paths:
      - "scripts/**"
    gates: [static, lint]

  - id: repo-meta
    description: Root metadata, editor/ignore/license/example files
    paths:
      - ".codex.example/**"
      - .editorconfig
      - .gitattributes
      - .gitignore
      - .ignore
      - .pre-commit-config.yaml
      - LICENSE
      - LEGACY_MANIFEST.example.yaml
      - "apps/.gitignore"
      - "archeaxis/**"
    gates: [static]

  - id: legacy-contracts
    description: Legacy manifest/plugin/workspace contract schemas (maintenance-only)
    paths:
      - "contracts/**"
    gates: [static, lint]

  - id: legacy-python-embed
    description: Legacy Inspiration-Research embedded pure Python (maintenance-only)
    paths:
      - "Inspiration-Research/**"
    gates: [static, lint, py-primary]

  - id: runtime-config
    description: Product runtime defaults, profiles, models and tool config
    paths:
      - "config/**"
    gates: [static, lint, py-primary]

  - id: formal-frontend-metadata
    description: Known documentation under the formal frontend outside its UI and build-input classes
    paths:
      - frontend/README.md
      - frontend/UI-POLISH-PLAN.md
    gates: [static, lint]

  - id: legacy-ui-other
    description: Other desktop repository paths not covered by the specific host and build classes
    paths:
      - "desktop/**"
    gates: [static, lint]

  - id: legacy-root-scripts
    description: Repository root launcher scripts and CLI shims
    paths:
      - run_all.bat
      - run_all.sh
      - run_windows.bat
      - run_windows.ps1
      - ecosystem.config.cjs
      - archeaxis
      - conftest.py
    gates: [static, lint]

  - id: packaging
    description: Packaging layout and release scripts (vNext/legacy)
    paths:
      - "packaging/**"
    gates: [static, lint]

  - id: docs-mechanical
    description: Documentation, ledgers, no runtime semantics
    paths:
      - "docs/**"
      - README.md
      - CHANGELOG.md
      - "**/*.md"
    gates: [static]

# Unknown path handling (AXC-060): the controller MUST classify with
# static + primary tests first, mark the path `unclassified`, and BLOCK
# merge until the profile gains a classification. It must NOT fall back
# to full-qualification or run NSIS/desktop-build for unknown paths.
unclassified:
  gates: [static, lint, py-primary]
  action: block-until-classified

# AXC-130: optional external coordination contract (WORK-LAB).
# WORK-LAB may READ this profile, validate its schema, observe CI and bind
# its Task Ledger. It may NEVER modify business profiles, execute arbitrary
# shell, write project DBs, or treat Observer state as project capability
# truth. This project runs standalone without WORK-LAB.
external_contract:
  repo_id: "DTALEX66/ArcheAxis-Knowledge-OS"
  workflow: "ci.yml (fast) + nightly.yml (compat) + release.yml (exact-SHA)"
  stable_aggregate: "a0-gates"
  gate_vocabulary: ".worklab/gate-registry.v1.yaml"
  verification_tier: "staged (dev targeted / stage full CI / RC installed / Release exact-SHA)"
  privacy_approved_roots:
    - "<repo>/"
  evidence_locations:
    - ".project-local/runs/"
    - "data/backups/"
