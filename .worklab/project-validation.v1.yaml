# Project Validation Profile — ArcheAxis Knowledge
#
# Deterministic changed-path classifier input. Maps real paths to risk classes
# and a required Gate set. The classifier unions Gate sets across all matched
# classes. `full-qualification` is a logical stage/RC profile only and is NEVER
# triggered by ordinary or unknown changes (AXC-060): unknown paths run
# static + classification review and block merge until the profile is updated,
# without defaulting to NSIS/full matrix.
# This profile is the OS-local risk source of truth in standalone mode.

schema_version: "2.0"
project_id: "DTALEX66/ArcheAxis-Knowledge-OS"  # product = ArcheAxis Knowledge
controller_protocol: ">=1.0,<2.0"

modes:
  standalone: required
  managed: optional

fallback:
  unknown_change: unclassified-block  # static + primary + classification review; no full-qualification
  controller_unavailable: standalone
  invalid_evidence: unclassified-block

# Ordered path prefixes. First match wins for classification; Gate sets are
# then unioned across every matching risk class so mixed changes take the
# broadest required set.
risk_classes:
  - id: ci-desktop-build-policy
    description: Windows desktop build or installer lifecycle workflow changes
    paths:
      - ".github/workflows/ci.yml"
    gates: [static, lint, desktop-fast, desktop-build, installer-lifecycle]

  - id: release-workflow
    description: Release workflow/tag changes
    paths:
      - ".github/workflows/release.yml"
    gates: [release-verify]

  - id: ci-policy
    description: CI workflow, classifier, gate registry, release scripts
    paths:
      - ".github/**"
      - ".worklab/**"
      - ".project/**"
      - "scripts/ci/**"
      - "scripts/release_*.py"
    gates: [static, lint]

  - id: vnext-rust-core
    description: vNext Rust workspace (sole authoritative writer) or its lockfiles
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - "crates/**"
    gates: [static, lint, rust-vnext]

  - id: vnext-avalonia-desktop
    description: vNext Avalonia/C# desktop shell, supervisor, SDK pinning
    paths:
      - "apps/ArcheAxis.Desktop/**"
      - global.json
      - Directory.Packages.props
    gates: [static, lint, desktop-vnext]

  - id: vnext-contracts
    description: vNext cross-language contract package and its tests
    paths:
      - "packages/contracts/**"
      - "tests/contract/**"
      - "crates/archeaxis-contracts/**"
      - "crates/archeaxis-sidecar-protocol/**"
    gates: [static, lint, contracts-vnext]

  - id: vnext-workers
    description: vNext isolated Python capability workers
    paths:
      - "services/python-workers/**"
    gates: [static, lint, workers-vnext]

  - id: vnext-journey-integration
    description: vNext journey / closed-loop integration test suites
    paths:
      - "tests/journey/**"
      - "tests/integration/closed-loop/**"
      - "tests/integration/research/**"
      - "tests/integration/learning/**"
      - "tests/integration/machine/**"
    gates: [static, lint, rust-vnext, desktop-vnext, workers-vnext]

  - id: vnext-ci-policy
    description: vNext CI workflow or scope checker changes force every vNext lane
    paths:
      - ".github/workflows/vnext-ci.yml"
      - "scripts/ci/check_vnext_scope.py"
    gates: [static, lint, rust-vnext, desktop-vnext, contracts-vnext, workers-vnext]

  - id: vnext-authority-docs
    description: Contract/decision ledgers, receipts and vNext reference docs (no runtime semantics)
    paths:
      - PROJECT_CONTRACT.yaml
      - DECISION_SUPERSESSION_LEDGER.yaml
      - DIRECTORY_AUTHORITY.yaml
      - LEGACY_MANIFEST.yaml
      - AGENTS.md
      - "docs/authority/**"
      - "docs/design/**"
      - "reports/vnext/**"
      - "reports/**"
    gates: [static]

  - id: security-permissions
    description: Permissions, secrets, SSRF, path/symlink boundaries
    paths:
      - scripts/check_architecture.py
      - scripts/check_repository_conventions.py
      - shared/approved_paths.py
      - shared/runtime_guard.py
    gates: [static, lint, security-targeted, py-primary]

  - id: db-migration
    description: Schema, migrations, data recovery
    paths:
      - "shared/*_migration.py"
      - shared/core_schema.py
      - shared/migration_runner.py
      - "**/migrations/**"
      - "migrations/**"
    gates: [static, lint, migration-targeted, py-primary]

  - id: rust-tauri-shell
    description: Canonical Tauri shell Rust logic without packaging inputs
    paths:
      - "src-tauri/src/*.rs"
      - "src-tauri/src/**/*.rs"
    gates: [desktop-fast]

  - id: installer
    description: Bundle, stage, NSIS, exit/uninstall
    paths:
      - "desktop/scripts/**"
      - frontend/vite.config.ts
      - "src-tauri/**"
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/build.rs
      - desktop/package.json
    gates: [desktop-fast, desktop-build, installer-lifecycle]

  - id: desktop-build
    description: Tauri build/config/resources
    paths:
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/build.rs
      - "desktop/src-tauri/icons/**"
    gates: [desktop-fast, desktop-build]

  - id: rust-tauri
    description: Rust/Tauri non-packaging logic
    paths:
      - "desktop/src-tauri/**/*.rs"
    gates: [desktop-fast]

  - id: cargo-npm-deps
    description: Cargo/npm ecosystem dependencies
    paths:
      - desktop/src-tauri/Cargo.lock
      - desktop/package-lock.json
    gates: [desktop-fast]

  - id: wheel-packaging
    description: package-data, entry points, wheel config
    paths:
      - pyproject.toml
      - MANIFEST.in
      - app/release-manifest.json
    gates: [static, lint, wheel-smoke]

  - id: python-compat
    description: Public Python contracts, dependency matrix and requirements
    paths:
      - pyproject.toml
      - requirements.txt
      - uv.lock
      - "shared-contracts/**"
    gates: [static, lint, py-compat, wheel-smoke]

  - id: dependency-change
    description: Lock/license-affecting dependency changes
    paths:
      - uv.lock
      - requirements.txt
    gates: [static, lint, wheel-smoke]

  - id: format-parser
    description: Format parsers / conversion engines that affect the installed wheel
    paths:
      - "app/ingestion/pdf.py"
      - "app/ingestion/multi_format.py"
      - "app/ingestion/*.py"
    gates: [static, lint, format-targeted, wheel-smoke]

  - id: windows-runtime
    description: Windows storage, migration, process, path handling
    paths:
      - "windows/**"
      - "shared/*windows*"
      - desktop/src-tauri/src/backend.rs
    gates: [static, lint, py-primary, windows-runtime]

  - id: ui
    description: UI resources, interaction, BFF/API consumed by UI
    paths:
      - "app/workspace/router.py"
      - "scripts/a0_browser_smoke.py"
      - "frontend/src/**"
      - "desktop/src/**/*.tsx"
      - "desktop/src/**/*.ts"
    gates: [static, lint, browser-smoke]

  - id: ordinary-python
    description: Ordinary Python backend business logic
    paths:
      - "app/**"
      - "shared/**"
      - "knowledge_base/**"
      - "inspiration_research/**"
      - "integration-tests/**"
      - "tests/**"
      - "scripts/check_*.py"
    gates: [static, lint, py-primary]

  - id: scripts-other
    description: Other repository tooling scripts (maintenance tools, pipeline drivers)
    paths:
      - "scripts/**"
    gates: [static, lint]

  - id: repo-meta
    description: Root metadata, editor/ignore/license/example files
    paths:
      - ".codex.example/**"
      - .editorconfig
      - .gitattributes
      - .gitignore
      - .pre-commit-config.yaml
      - LICENSE
      - LEGACY_MANIFEST.example.yaml
      - "apps/.gitignore"
      - "archeaxis/**"
    gates: [static]

  - id: legacy-contracts
    description: Legacy manifest/plugin/workspace contract schemas (maintenance-only)
    paths:
      - "contracts/**"
    gates: [static, lint]

  - id: legacy-python-embed
    description: Legacy Inspiration-Research embedded pure Python (maintenance-only)
    paths:
      - "Inspiration-Research/**"
    gates: [static, lint, py-primary]

  - id: runtime-config
    description: Product runtime defaults, profiles, models and tool config
    paths:
      - "config/**"
    gates: [static, lint, py-primary]

  - id: legacy-ui-other
    description: Legacy UI shell assets outside the dedicated frontend/desktop/src paths (maintenance-only)
    paths:
      - "OSUI/**"
      - "frontend/**"
      - "desktop/**"
      - "verified-knowledge/**"
    gates: [static, lint]

  - id: legacy-root-scripts
    description: Repository root launcher scripts and CLI shims
    paths:
      - run_all.bat
      - run_all.sh
      - run_windows.bat
      - run_windows.ps1
      - ecosystem.config.cjs
      - archeaxis
      - conftest.py
    gates: [static, lint]

  - id: packaging
    description: Packaging layout and release scripts (vNext/legacy)
    paths:
      - "packaging/**"
    gates: [static, lint]

  - id: docs-mechanical
    description: Documentation, ledgers, no runtime semantics
    paths:
      - "docs/**"
      - README.md
      - CHANGELOG.md
      - "**/*.md"
    gates: [static]

# Unknown path handling (AXC-060): the controller MUST classify with
# static + primary tests first, mark the path `unclassified`, and BLOCK
# merge until the profile gains a classification. It must NOT fall back
# to full-qualification or run NSIS/desktop-build for unknown paths.
unclassified:
  gates: [static, lint, py-primary]
  action: block-until-classified

# AXC-130: optional external coordination contract (WORK-LAB).
# WORK-LAB may READ this profile, validate its schema, observe CI and bind
# its Task Ledger. It may NEVER modify business profiles, execute arbitrary
# shell, write project DBs, or treat Observer state as project capability
# truth. This project runs standalone without WORK-LAB.
external_contract:
  repo_id: "DTALEX66/ArcheAxis-Knowledge-OS"
  workflow: "ci.yml (fast) + nightly.yml (compat) + release.yml (exact-SHA)"
  stable_aggregate: "a0-gates"
  gate_vocabulary: ".worklab/gate-registry.v1.yaml"
  verification_tier: "staged (dev targeted / stage full CI / RC installed / Release exact-SHA)"
  privacy_approved_roots:
    - "<repo>/"
  evidence_locations:
    - ".hermes/task-runtime/"
    - "data/backups/"
