# Gate Registry — ArcheAxis Knowledge
#
# Stable symbolic Gate IDs. A Gate is a *semantic* capability; it is not bound
# to a fixed GitHub job name. The `ci-verdict` aggregator expands these against
# the actual workflow and requires every *required* Gate to be `success`. A
# Gate may only be `skipped` when the GatePlan marks it `not-required`.
#
# Gate IDs are the contract surface shared with WORK-LAB. WORK-LAB may select
# only Gates registered here; it may never inject an arbitrary shell command.
# AXC-070: `full-qualification` is a logical stage/RC profile only and is never
# triggered by ordinary or unknown changes.

schema_version: "2.0"

gates:
  - id: static
    description: Convention, architecture, static rules
    required: always
  - id: lint
    description: Ruff / JS syntax / project scanners
    required: conditional
  - id: py-primary
    description: Primary Python version full OS/KB/integration suite
    required: conditional
  - id: py-compat
    description: Supported Python version compatibility matrix
    required: conditional
  - id: py-targeted
    description: Affected/primary Python tests only (fast path)
    required: conditional
  - id: format-targeted
    description: Format adapter targeted tests (conversion engines)
    required: conditional
  - id: migration-targeted
    description: Migration + backup/rollback/restore targeted tests
    required: conditional
  - id: security-targeted
    description: Security/path/network targeted tests
    required: conditional
  - id: browser-smoke
    description: Real Chromium workspace smoke
    required: conditional
  - id: windows-runtime
    description: Windows migration / runtime / HTTP
    required: conditional
  - id: desktop-fast
    description: cargo fmt/test and fast backend lifecycle
    required: conditional
  - id: desktop-build
    description: Tauri release build / bundle input validation
    required: conditional
  - id: installer-lifecycle
    description: NSIS build / install / start / exit / upgrade / uninstall
    required: conditional
  - id: wheel-smoke
    description: Wheel build, external install, package-data
    required: conditional
  - id: stage-verdict
    description: Stage aggregation gate for a frozen phase tree
    required: conditional
  - id: rust-vnext
    description: Rust vNext workspace tests (crates/*, Cargo.toml/lock)
    required: conditional
  - id: desktop-vnext
    description: Avalonia desktop build plus supervisor smoke against the Rust core
    required: conditional
  - id: contracts-vnext
    description: Cross-language contract schemas/drift consistency checks
    required: conditional
  - id: workers-vnext
    description: Python capability worker smoke (envelope protocol, failure contract)
    required: conditional
  - id: release-verify
    description: tag / asset / installer / download readback
    required: conditional
  - id: ci-verdict
    description: Stable aggregator that validates the GatePlan and required Gates
    required: always
  - id: full-qualification
    description: LOGICAL stage/RC profile expanding to every required Gate; never auto-triggered by ordinary/unknown paths (AXC-060/070)
    required: conditional

# full-qualification is a logical profile, not a fixed job count. It is used
# only for stage/RC/Release qualification decisions, never as the unknown-path
# fallback.
