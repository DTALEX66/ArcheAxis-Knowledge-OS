<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ArcheAxis Knowledge · UI 调整参考</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div class="design-notice"><span>UI 调整参考 · 固定样例数据 · 非产品运行状态</span><span>2026.10.02 / Avalonia 实施目标</span></div>
  <div class="aaos-app" id="aaos-app">
    <aside class="aaos-sidebar" aria-label="产品导航">
      <div class="aaos-brand"><span class="aaos-brand-mark">AA</span><div><strong>ArcheAxis</strong><small>星环知识平台</small></div></div>
      <button class="aaos-workspace-picker" data-action="open-workspace"><span class="aaos-workspace-avatar">A</span><span>个人知识工作空间<small>本地优先 · 开放知识</small></span><span class="aaos-chevron">⌄</span></button>
      <nav id="aaos-nav" aria-label="六大空间"></nav>
      <div class="aaos-sidebar-footer"><span class="aaos-user-avatar">A</span><div>个人工作空间<small>离线设计预览</small></div><button class="aaos-icon-button" data-action="toggle-theme" aria-label="切换极光青与黑白主题">◐</button></div>
    </aside>
    <div class="aaos-body">
      <header class="aaos-topbar">
        <button class="aaos-icon-button aaos-menu-button" data-action="toggle-nav" aria-label="打开导航">☰</button>
        <div class="aaos-breadcrumb" id="aaos-breadcrumb"></div>
        <button class="aaos-command" data-action="open-command"><span id="search-icon"></span><span>搜索知识、页面或未来能力</span><kbd>Ctrl K</kbd></button>
        <div class="aaos-top-actions"><button class="aaos-icon-button" data-action="toggle-theme" aria-label="切换主题">◐</button><button class="aaos-icon-button" data-action="toggle-inspector" aria-label="显示或隐藏对象详情" id="inspector-toggle"></button><button class="aaos-button aaos-primary" data-go="capture">捕获资料</button></div>
      </header>
      <div class="aaos-workarea" id="aaos-workarea">
        <main class="aaos-main" id="aaos-main" aria-label="主工作区"></main>
        <aside class="aaos-inspector" id="aaos-inspector" aria-label="对象详情"></aside>
      </div>
      <footer class="aaos-activity"><button data-action="toggle-activity" class="aaos-text-button"><span class="aaos-status-dot"></span>活动与处理记录 <span id="aaos-activity-count">样例</span></button><span id="aaos-activity-summary">固定样例 · 运行状态须由正式桌面读回</span><button class="aaos-text-button" data-go="jobs">查看全部</button></footer>
      <div id="aaos-activity-expanded" class="aaos-activity-expanded" hidden></div>
    </div>
  </div>
  <dialog id="aaos-dialog" class="aaos-dialog"></dialog>
  <div class="aaos-toast" id="aaos-toast" role="status" aria-live="polite" hidden></div>
  <script src="catalog.js"></script><script src="icons.js"></script><script src="ui.js"></script>
</body>
</html>
