    replacement: 用户 2026-09-08 交付 AAK-FOLLOWUP-20260908-R3（plan_only，未签发授权本身），实现基线 cbe253b107da0e8b6d55505bd9c3c2d8de59b7ed；23 个任务逐字节继承 R2 work/acceptance 并新增 r3_work/r3_acceptance 与 12 个治理/语言迁移切片（GOV01-05、LANG01-07）；活动入口唯一指向 docs/authority/taskpack-0908-r3/EXECUTION.md；R2 原任务文本与证据 SHA 保留为来源，Q00 失败/Q01 不具资格的审计结论继承为基线
