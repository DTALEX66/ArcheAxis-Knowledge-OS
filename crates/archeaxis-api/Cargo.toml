[package]
name = "archeaxis-api"
version = "0.1.0"
edition = "2024"
description = "ArcheAxis vNext local HTTP API (thin projection over the domain crate)"

[dependencies]
archeaxis-domain = { path = "../archeaxis-domain" }
archeaxis-store-sqlite = { path = "../archeaxis-store-sqlite" }
archeaxis-contracts = { path = "../archeaxis-contracts" }
archeaxis-application = { path = "../archeaxis-application" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"
