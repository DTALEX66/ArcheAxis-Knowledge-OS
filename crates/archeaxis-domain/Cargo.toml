[package]
name = "archeaxis-domain"
version = "0.1.0"
edition = "2024"
description = "ArcheAxis vNext domain Core (sole business writer via store)"

[dependencies]
rusqlite = { version = "=0.39.0", features = ["bundled", "backup"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde_yaml_ng = "=0.10.0"
unicode-general-category = "=1.1.0"
base64 = "=0.22.1"
archeaxis-contracts = { path = "../archeaxis-contracts" }
archeaxis-store-sqlite = { path = "../archeaxis-store-sqlite" }
tempfile = "3"

[dev-dependencies]
rusqlite = { version = "=0.39.0", features = ["collation"] }
tempfile = "3"
