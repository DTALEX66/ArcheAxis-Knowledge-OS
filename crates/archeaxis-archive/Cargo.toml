[package]
name = "archeaxis-archive"
version = "0.1.0"
edition = "2024"
description = "ArcheAxis vNext open-format archive: export/restore with sha256 manifest"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
archeaxis-store-sqlite = { path = "../archeaxis-store-sqlite" }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
archeaxis-domain = { path = "../archeaxis-domain" }
archeaxis-application = { path = "../archeaxis-application" }
