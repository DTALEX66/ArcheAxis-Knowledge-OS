[package]
name = "archeaxis-sidecar-protocol"
version = "0.1.0"
edition = "2024"
description = "ArcheAxis vNext Supervisor<->Core sidecar messages (launch handshake, health, worker receipts)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
