[package]
name = "archeaxis-application"
version = "0.1.0"
edition = "2024"
description = "ArcheAxis vNext application layer: bootstrap, handshake, worker-job orchestration"

[dependencies]
archeaxis-domain = { path = "../archeaxis-domain" }
archeaxis-store-sqlite = { path = "../archeaxis-store-sqlite" }
archeaxis-contracts = { path = "../archeaxis-contracts" }
archeaxis-sidecar-protocol = { path = "../archeaxis-sidecar-protocol" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
