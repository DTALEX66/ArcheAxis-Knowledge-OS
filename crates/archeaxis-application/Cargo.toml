[package]
name = "archeaxis-application"
version = "0.1.0"
edition = "2024"
description = "ArcheAxis vNext application layer: bootstrap, handshake, worker-job orchestration"

[dependencies]
archeaxis-domain = { path = "../archeaxis-domain" }
archeaxis-store-sqlite = { path = "../archeaxis-store-sqlite" }
archeaxis-contracts = { path = "../archeaxis-contracts" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
