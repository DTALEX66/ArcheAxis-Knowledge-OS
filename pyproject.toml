[project]
name = "cognitive-loop-os"
version = "0.4.0"
description = "Local-first cognitive and knowledge runtime with evidence-constrained workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "DTALEX66" },
]
keywords = ["cognitive-os", "knowledge-base", "agent", "fastapi", "sqlite-vec"]

dependencies = [
    "fastapi>=0.133,<0.134",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.22",
    "pydantic>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.11",
    "defusedxml>=0.7.1",
    "apscheduler>=3.10",
    "sqlite-vec>=0.1.6",
    "loguru>=0.7",
    "structlog>=24.0",
    "markitdown>=0.1",
    "trafilatura>=1.6",
    "networkx>=3.0",
    "litellm==1.91.0",
    "pillow>=10.0",
    "pytesseract>=0.3.13",
]

[dependency-groups]
build = ["setuptools==83.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "pre-commit>=3.7",
    "tomli>=2.0; python_version < '3.11'",
]
ingestion = [
    "crawl4ai>=0.1",
    "langfuse>=4.0",
    "promptfoo>=0.1",
]
full = [
    "cognitive-loop-os[dev,ingestion]",
]

[project.scripts]
cognitive-os = "app.cli:main"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "shared*", "knowledge_base*", "inspiration_research*", "config*"]
exclude = [
    "data*",
    "logs*",
    "tests*",
    "knowledge_base.tests*",
    "*.tests",
    "*.tests.*",
    "workspace*",
    "docker*",
]
namespaces = true

[tool.setuptools.package-data]
"app.workspace" = ["ui/*.html", "ui/assets/*.css", "ui/assets/*.js"]
knowledge_base = ["templates/*.html", "static/**/*"]
config = ["*.yaml"]
inspiration_research = ["resources/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "venv",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "SIM108", # use ternary operator
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow unused imports in __init__.py
"tests/**/*.py" = ["S101"] # allow assert in tests
"knowledge_base/api.py" = ["E501", "E702"]  # legacy compact endpoint bodies
"app/main.py" = ["E402", "E501"]  # route imports follow application setup

"inspiration_research/api.py" = ["E701", "E702"]  # legacy compact endpoint bodies

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
