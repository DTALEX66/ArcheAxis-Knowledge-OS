[project]
name = "cognitive-loop-os"
version = "0.4.0"
description = "Cognitive Loop OS — AI cognitive runtime with A/B/C three-line architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DTALEX66" },
]
keywords = ["cognitive-os", "knowledge-base", "agent", "fastapi", "sqlite-vec"]

dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "pydantic>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.11",
    "apscheduler>=3.10",
    "sqlite-vec>=0.1.6",
    "loguru>=0.7",
    "structlog>=24.0",
    "markitdown>=0.1",
    "trafilatura>=1.6",
    "networkx>=3.0",
    "litellm>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "mypy>=1.8",
]
ingestion = [
    "crawl4ai>=0.1",
    "langfuse>=4.0",
    "promptfoo>=0.1",
]
full = [
    "cognitive-loop-os[dev,ingestion]",
]

[project.scripts]
cognitive-os = "app.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "venv",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "SIM108", # use ternary operator
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow unused imports in __init__.py
"tests/**/*.py" = ["S101"] # allow assert in tests
"Knowledge-Base/api.py" = ["E402", "E501", "E702"]  # sys.path + legacy compact endpoints
"app/main.py" = ["E402", "E501"]  # sys.path + compact response literals
"Knowledge-Base/tests/*.py" = ["E402"]  # sys.path manipulation
"shared/bridge.py" = ["E402"]  # sys.path manipulation

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "Knowledge-Base"]
