[project]
name = "archeaxis-workspace"
version = "0.6.0"
description = "Local-first, evidence-driven Human–AI learning and knowledge workspace"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "DTALEX66" },
]
keywords = ["learning-workspace", "knowledge-base", "evidence-driven", "fastapi", "sqlite-vec"]

dependencies = [
    "fastapi>=0.133,<0.134",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.22",
    "pydantic>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.11",
    "defusedxml>=0.7.1",
    "apscheduler>=3.10",
    "sqlite-vec>=0.1.6",
    "loguru>=0.7",
    "structlog>=24.0",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1",
    "pymupdf>=1.24",
    "trafilatura>=1.6",
    "networkx>=3.0",
    "litellm==1.91.0",
    "pillow>=10.0",
    "pytesseract>=0.3.13",
    "jiwer>=3.1",
    "rapidfuzz>=3.9",
    "fsrs>=5.0",
    "onnxruntime>=1.18",
    "striprtf>=0.0.32",
]

[dependency-groups]
build = ["setuptools==83.0.0"]
browser = [
    "playwright>=1.61,<1.62",
    "pymupdf>=1.24",
]
ci = [
    "apscheduler>=3.10",
    "beautifulsoup4>=4.11",
    "defusedxml>=0.7.1",
    "fastapi>=0.133,<0.134",
    "httpx>=0.28",
    "jinja2>=3.1,<4",
    "jsonschema>=4.0",
    "loguru>=0.7",
    "networkx>=3.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pytest>=7.0",
    "playwright>=1.61,<1.62",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "requests>=2.28",
    "ruff>=0.5",
    "sqlite-vec>=0.1.6",
    "structlog>=24.0",
    "jiwer>=3.1",
    "rapidfuzz>=3.9",
    "fsrs>=5.0",
    "onnxruntime>=1.18",
    "tomli>=2.0; python_version < '3.11'",
    "uvicorn[standard]>=0.22",
]
ci-adapters = [
    "faster-whisper>=1.1",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1",
    "pymupdf>=1.24",
    "newspaper4k>=0.9",
    "rapidocr-onnxruntime>=1.4",
    "readabilipy>=0.3",
    "trafilatura>=1.6",
    "youtube-transcript-api>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "pre-commit>=3.7",
    "tomli>=2.0; python_version < '3.11'",
]
ingestion = [
    "crawl4ai>=0.1",
    "langfuse>=4.0",
    "promptfoo>=0.1",
]
full = [
    "archeaxis-workspace[dev,ingestion]",
]

[project.scripts]
archeaxis = "app.cli:main"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "shared*", "knowledge_base*", "inspiration_research*", "config*"]
exclude = [
    "data*",
    "logs*",
    "tests*",
    "knowledge_base.tests*",
    "*.tests",
    "*.tests.*",
    "workspace*",
    "docker*",
]
namespaces = true

[tool.setuptools.package-data]
app = ["release-manifest.json"]
"app.workspace" = ["ui/*.html", "ui/assets/*.css", "ui/assets/*.js", "ui/assets/licenses/*.txt"]
knowledge_base = ["templates/*.html", "static/**/*"]
config = ["*.yaml", "profiles/*.yaml"]
inspiration_research = ["resources/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "venv",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "SIM108", # use ternary operator
    "UP017",  # Python 3.11 uplift: defer datetime.UTC modernization to a dedicated lint migration
    "UP042",  # Python 3.11 uplift: defer StrEnum migration to a dedicated compatibility review
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow unused imports in __init__.py
"tests/**/*.py" = ["S101"] # allow assert in tests
"knowledge_base/api.py" = ["E501", "E702"]  # legacy compact endpoint bodies
"app/main.py" = ["E402", "E501"]  # route imports follow application setup
"integration-tests/**/*.py" = ["N999"]  # hyphen in integration test directory name

"inspiration_research/api.py" = ["E701", "E702"]  # legacy compact endpoint bodies

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
]

[tool.pytest.ini_options]
testpaths = ["tests", "knowledge_base/tests"]
pythonpath = ["."]
