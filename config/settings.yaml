# Cognitive-Loop-OS Configuration
# Override defaults from shared/config.py
# Environment variables take precedence over this file.

app:
  name: "Cognitive-Loop-OS"
  version: "0.4.0"
  release_version: ""
  environment: "development"
  port: 8000
  host: "0.0.0.0"

database:
  path: "data/cognitive_os.sqlite"
  journal_mode: "WAL"
  backup_dir: "data/backups"

logging:
  level: "INFO"
  console: true
  file: true
  file_dir: "data/logs"
  rotation: "10 MB"
  retention: "7 days"

auth:
  enabled: false  # Set true in production
  token_expire_hours: 24

# Process-local sliding-window limits. Each worker has independent counters.
rate_limit:
  enabled: true
  window_seconds: 60
  ordinary_read: 200
  sensitive_write: 30
  auth_token: 5
  max_buckets_per_policy: 10000
  # Caddy overwrites X-Forwarded-For; the app trusts it only from this edge CIDR.
  trusted_proxies: []

pipeline:
  max_content_chars: 10000
  default_actions: ["extract", "tag", "summarize", "index"]
  auto_ingest: true

search:
  fts5_enabled: true
  vector_enabled: true
  vector_dim: 384
  default_top_k: 5

cors:
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "DELETE"]
  allow_headers: ["Authorization", "Content-Type", "X-API-Key"]
