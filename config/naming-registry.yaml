version: 1
required_locales:
  - en-US
  - zh-CN

services:
  core:
    python_package: app
    api_prefix: /
    display:
      en-US: Cognitive Runtime
      zh-CN: 认知运行时
    deprecated_aliases:
      - cognitive-runtime
      - Cognitive-OS
      - Cognitive_OS
      - cognitive-os
      - cognitive_os
      - Cognitive-Loop-OS

  knowledge-base:
