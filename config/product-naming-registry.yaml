version: 3
status: active
product:
  brand:
    en-US: ArcheAxis
    zh-CN: ArcheAxis
    class: display
  name:
    en-US: ArcheAxis Knowledge
    zh-CN: 星环知识平台
    class: display
  description:
    en-US: A local-first, evidence-driven, bidirectional Human–AI Learning & Trusted-Knowledge Workspace.
    zh-CN: 本地优先、证据可追溯、开放互操作的人机双向学习与可信知识治理工作台。
    class: display
  compatibility_stage:
    en-US: Obsidian-compatible Workspace foundation
    zh-CN: Obsidian 兼容工作台基础
    class: display
  deprecated_display:
    - value: ArcheAxis Workspace
      class: legacy
      allowed_surfaces: [desktop_protocol, installer_migration, historical_release, compatibility_docs]
    - value: ArcheAxis Knowledge
      class: legacy
      allowed_surfaces: [desktop_protocol, installer_migration, historical_release]
    - value: 元枢工作台
      class: legacy
      allowed_surfaces: [historical_release, compatibility_docs]
    - value: 元枢系统
      class: legacy
      allowed_surfaces: [historical_release, compatibility_docs]
    - value: 元枢·观心
      class: forbidden_default
      allowed_surfaces: [user_defined_profile_only]
technical_ids:
  registry:
    source: config/naming-registry.yaml
    class: canonical_machine_identity
    allowed_surfaces: [api, database, events, configuration]
forbidden_default_terms:
  - archeaxis-workspace
  - Cognitive OS
  - 认知操作系统
  - 认知运行时
  - 元枢·观心
  - 通用 Agent OS
  - 星轨
rules:
  default_ui_product_name: ArcheAxis Knowledge
  default_ui_product_name_zh: 星环知识平台
  preserve_technical_compatibility_ids: true
  github_repository_rename: explicit_decision_required
  tauri_identifier_change: migration_and_rollback_required
  data_directory_change: migration_and_readback_required
