      purpose: "F10 说话人分离的两枚 ONNX（pyannote 分割 + 说话人嵌入），从共享 Model library 读取，不复制进 Git"
      version_range: "segmentation-3.0 / wespeaker-voxceleb-resnet34-LM"
      version_identification: "两枚 .onnx 同时存在（本机实测文件名：segmentation-3.0.onnx 与 speaker-embedding.onnx；缺任一枚则该能力不可用）"
      platform: windows-x64
      license: "Apache-2.0 for the sherpa-onnx runtime that loads them; the ONNX assets are licensed separately (see asset_license)"
      asset_license: "MIT (pyannote/segmentation-3.0, Copyright (c) 2022 CNRS) + CC-BY-4.0 (upstream WeSpeaker card; the k2-fsa mirror repo ships no licence file)"
      source_url: "https://hf-mirror.com/csukuangfj/sherpa-onnx-pyannote-segmentation-3-0"
      install_method: system
      healthcheck_command: "both files present under sherpa-onnx/speaker-diarization"
      sibling_root: model-library
      external_paths: ["sherpa-onnx/speaker-diarization"]
      project_entry: "tool_paths.tool_path(\"sherpa-onnx-speaker-diarization\")"
      writability: shared_read_only
      probe:
        kind: path_exists
        paths: ["sherpa-onnx/speaker-diarization/segmentation-3.0.onnx", "sherpa-onnx/speaker-diarization/speaker-embedding.onnx"]
        reaches: FILE_EXISTS
      fallback: "任一枚缺失则 F10 具名不可用；不自动接受 pyannote gated 下载"
      required_by: [asr-pipeline]
      local_only: true

    - name: magika-standard-v3
      resource_id: ext.models.magika-standard-v3
      type: model
      purpose: "文件类型检测 ONNX 模型（优先共享 Model library；仓库副本仅作离线回退）"
      version_range: "standard_v3_3"
      version_identification: "绑定目录内的 model.onnx + config 存在性（版本由目录名 standard_v3_3 声明）"
      platform: windows-x64
      license: "Apache-2.0 (magika code licence)"
      asset_license: "magika standard_v3_3 ONNX weights, Apache-2.0 upstream; shipped with the installed magika 0.6.3 package"
      source_url: "https://github.com/google/magika"
      install_method: 内置
      external_paths: ["ArcheAxis-Knowledge-OS-ci-venv/Lib/site-packages/magika/models/standard_v3_3"]
      project_entry: "tool_paths.tool_path(\"magika-standard-v3\") / ARCHEAXIS_MAGIKA_MODEL_DIR override"
      writability: shared_writable_by_project
      healthcheck_command: "path exists: standard_v3_3/model.onnx"
      probe:
        kind: path_exists
        paths: ["ArcheAxis-Knowledge-OS-ci-venv/Lib/site-packages/magika/models/standard_v3_3/model.onnx"]
        reaches: FILE_EXISTS
      fallback: "缺 model.onnx 则文件检测退回规则判定并具名记录，不静默下载权重"
      required_by: [file-detection]
      local_only: true

    # 以下四条是**项目真实消费的本机模型通道**（此前只写死在 Python 源码里，索引完全没有
    # 覆盖）：worker_caption.py / machine/worker_machine_answer.py 硬编码
    # http://127.0.0.1:11434 与 http://127.0.0.1:1234/v1，只能被 ARCHEAXIS_CAPTION_* 顶掉。
    # 本机 2026-10-08 实测（不是沿用任何历史说法）：11434 **连接被拒绝**（WinError 10061，
    # 端口关闭），1234 **在线**并列出 6 个模型，/v1/embeddings 真跑通（1024 维，2.8s）。
    # 因此这里不写"Ollama 被阻塞"，只写探针在本机答了什么。
    - name: ollama-local-runtime
      resource_id: ext.models.ollama-local-runtime
      type: model_endpoint
      role: caption
      purpose: "Ollama 本机推理通道（worker_caption 早期唯一写死的通道，/api/tags 列模型、/api/generate 出文）"
      version_range: "any local build"
      version_identification: "GET /api/tags 应答的 models[].name 列表"
      platform: windows-x64
      license: "MIT (the Ollama runtime licence; per-model weights carry their own cards)"
      asset_license: "Served weights are licensed per upstream model card; nothing here restates them"
      source_url: "https://ollama.com/"
      install_method: system
      endpoint:
        protocol: ollama
        base_url: "http://127.0.0.1:11434"
        list_path: /api/tags
      project_entry: "tool_paths.endpoint_resources(role=\"caption\") -> services/python-workers/vision/worker_caption.py"
      writability: project_writable
      healthcheck_command: "GET http://127.0.0.1:11434/api/tags"
      probe:
        kind: http_get
        expect_status: 200
        expect_pattern: "models"
        timeout_seconds: 5
        reaches: VERSION_PROBED
      fallback: "通道不答即记 unavailable 并写出实测错误；不自动拉起 ollama serve，不改宿主服务配置"
      failure_message: "ollama-local-runtime: no HTTP answer on 127.0.0.1:11434 (this host refused the connection); caption lane falls back to any OpenAI-compatible lane the declaration names"
      required_by: [workspace-ui, asr-pipeline]
      local_only: true

    - name: openai-compatible-local-runtime
      resource_id: ext.models.openai-compatible-local-runtime
      type: model_endpoint
      role: caption
      purpose: "OpenAI 兼容的本机模型通道（LM Studio 形态：/v1/models 列模型、/v1/chat/completions 出文），本机的视觉描述 lane 实际由它答"
      version_range: "any OpenAI-compatible server"
      version_identification: "GET /v1/models 的 data[].id 列表（本机实测 6 项）"
      platform: windows-x64
      license: "n/a (the lane is a protocol, not a shipped component; the serving app is the host's own install)"
      asset_license: "Served weights are licensed per upstream model card; per-model rows below name the identity the host answers with"
      source_url: "https://platform.openai.com/docs/api-reference/chat"
      install_method: system
      endpoint:
        protocol: openai
        base_url: "http://127.0.0.1:1234/v1"
        list_path: /models
      project_entry: "tool_paths.endpoint_resources(role=\"caption\") -> services/python-workers/vision/worker_caption.py"
      writability: project_writable
      healthcheck_command: "GET http://127.0.0.1:1234/v1/models"
      probe:
        kind: http_get
        expect_status: 200
        expect_pattern: "qwen2\\.5-vl-7b-instruct"
        timeout_seconds: 10
        reaches: VERSION_PROBED
      fallback: "不答则 caption 具名不可用并回 pillow-metadata；绝不静默下载权重或改指公网服务"
      failure_message: "openai-compatible-local-runtime: /v1/models did not answer on 127.0.0.1:1234"
      required_by: [workspace-ui]
      local_only: true

    - name: local-vision-caption-model
      resource_id: ext.models.local-vision-caption-model
      type: model
      role: caption
      purpose: "图示/场景描述使用的视觉模型身份（两个本机 runtime 对同一权重命名不同：ollama 的 qwen2.5vl:7b 与 OpenAI 通道的 qwen2.5-vl-7b-instruct）"
      version_range: "qwen2.5-vl-7b-instruct"
      version_identification: "所属 lane 的模型列表里出现该 id（身份由 lane 答出的 id 确定，不是由源码常量确定）"
      platform: windows-x64
      license: "n/a (model asset only)"
      asset_license: "Qwen2.5-VL-7B-Instruct weights under the upstream Qwen model-card terms; served by the host's own install, no weights vendored in Git"
      source_url: "https://huggingface.co/Qwen/Qwen2.5-VL-7B-Instruct"
      install_method: system
      endpoint:
        protocol: openai
        base_url: "http://127.0.0.1:1234/v1"
        list_path: /models
        model_id: qwen2.5-vl-7b-instruct
      project_entry: "worker_caption._endpoint() resolved through tool_paths.endpoint_resources(role=\"caption\")"
      writability: project_writable
      healthcheck_command: "GET http://127.0.0.1:1234/v1/models contains qwen2.5-vl-7b-instruct"
      probe:
        kind: http_get
        expect_status: 200
        expect_pattern: "qwen2\\.5-vl-7b-instruct"
        timeout_seconds: 10
        reaches: VERSION_PROBED
      fallback: "id 不在列表则具名 unavailable（错误信息列出该 lane 实际装了哪些模型），描述 lane 退回元数据而不是空文本"
      failure_message: "local-vision-caption-model: no served vision model id matched the declaration on any declared lane; the lanes' own model lists are printed in the error"
      required_by: [workspace-ui]
      local_only: true

    - name: local-embedding-model
      resource_id: ext.models.local-embedding-model
      type: model
      role: embedding
      purpose: "检索 embedding 通道（config/model-profiles/r6-capability-pool.json 的 ollama/qwen3:8b 与 app/rag/embedder.py 写死的 127.0.0.1:11434；本机实际由 OpenAI 兼容 lane 的 qwen3-embedding-0.6b 作答）"
      version_range: "text-embedding-qwen3-embedding-0.6b"
      version_identification: "POST /v1/embeddings 返回向量维度（真跑一次小输入，不是看模型列表）"
      platform: windows-x64
      license: "n/a (model asset only; the hash-embedding fallback in config/models.yaml is first-party code)"
      asset_license: "Qwen3-Embedding-0.6B weights under the upstream Qwen model-card terms; served by the host's own install"
      source_url: "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B"
      install_method: system
      endpoint:
        protocol: openai
        base_url: "http://127.0.0.1:1234/v1"
        embed_path: /embeddings
        model_id: text-embedding-qwen3-embedding-0.6b
      project_entry: "tool_paths.endpoint_resources(role=\"embedding\")；app/rag/embedder.py 的写死 lane 尚未改为读声明（见执行报告未证实项）"
      writability: project_writable
      healthcheck_command: "POST http://127.0.0.1:1234/v1/embeddings {model, input}"
      probe:
        kind: http_roundtrip
        expect_status: 200
        body_template: '{"model": "{model_id}", "input": ["ArcheAxis resource probe"]}'
        expect_json_path: "data.0.embedding"
        min_vector_length: 8
        timeout_seconds: 60
        reaches: RESULT_VERIFIED
      fallback: "不答则退回 config/models.yaml 的 hash-embedding 并在证据里具名标记为降级通道；不静默下载权重"
      failure_message: "local-embedding-model: the declared embedding lane returned no vector"
      required_by: [core-runtime]
      local_only: true

    - name: local-rerank-model
      resource_id: ext.models.local-rerank-model
      type: model
      role: rerank
      purpose: "重排通道（qwen3-reranker-0.6b 由本机 lane 列出，但该 runtime 不提供 /v1/rerank：实测 POST /v1/rerank 返回 {\"error\":\"Unexpected endpoint or method\"}）"
      version_range: "qwen3-reranker-0.6b"
      version_identification: "模型 id 出现在所属 lane 的 /v1/models 列表里（重排调用本身在本机没有可跑的接口）"
      platform: windows-x64
      license: "n/a (model asset only)"
      asset_license: "Qwen3-Reranker-0.6B weights under the upstream Qwen model-card terms; served by the host's own install"
      source_url: "https://huggingface.co/Qwen/Qwen3-Reranker-0.6B"
      install_method: system
      endpoint:
        protocol: openai
        base_url: "http://127.0.0.1:1234/v1"
        list_path: /models
        rerank_path: /rerank
        model_id: qwen3-reranker-0.6b
      project_entry: "tool_paths.endpoint_resources(role=\"rerank\")"
      writability: project_writable
      healthcheck_command: "GET http://127.0.0.1:1234/v1/models contains qwen3-reranker-0.6b (the rerank call itself is NOT_RUN on this host)"
      probe:
        kind: not_run
        reason: "the model id is served, but the host's runtime answers POST /v1/rerank with {\"error\":\"Unexpected endpoint or method. (POST /v1/rerank)\"} (measured 2026-10-08). No rerank round-trip can be certified through the project entry on this host; the row is recorded NOT_RUN rather than as a version or a result."
        reaches: REGISTERED
      fallback: "重排不可用则检索只按向量分数排序，并在证据里写明未重排；不引入第二个 reranker"
      failure_message: "local-rerank-model: NOT_RUN - model listed by the lane, no rerank endpoint on this host"
      required_by: [core-runtime]
      local_only: true
