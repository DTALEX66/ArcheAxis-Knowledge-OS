# =============================================================================
# ArcheAxis-Knowledge-OS 外置能力需求规范（机器可读）
# -----------------------------------------------------------------------------
# 权威文档：docs/environment/EXTERNAL_DEPENDENCIES.md（人类可读）
# 本文件：  机器可读需求清单，供 host inventory / CI / 环境审计消费。
# 同步规则：新增系统工具、模型、外部服务必须同时登记两处。
#
# 这一份清单是**唯一的绑定来源**。四处读取方（worker 解析器
# services/python-workers/tool_paths.py、宿主清点 scripts/workflow/environment_registry.py、
# 外置索引 scripts/environment/build_external_resources_index.py、开发入口
# scripts/runtime/dev.py）都读同一份声明，而不是各猜各的：
#   · 声明路径优先，PATH 只在没有声明时作为**具名的** unbound_path_fallback 被记录，
#     绝不当作项目的绑定（一次全局 PATH 命中顶掉项目声明 = 静默替换）；
#   · 一个条目只有用它**自己的解释器**跑它**自己的**健康检查才算数；
#     `uv run python -c "import X"` 被削减成 token `uv` 再拿 uv 的版本 certify 引擎，
#     是伪造 RESULT_VERIFIED；目录也永远不能满足版本探针；
#   · 跑不了的探针记 unavailable / NOT_RUN 并写明原因，绝不继承包装二进制的版本。
#
# 类别说明：
#   toolchains — 工具链（编译器、包管理器、浏览器二进制等）
#   runtimes   — 运行时环境（WebView2 运行时、虚拟环境、桌面运行时包）
#   engines    — 引擎（OCR / ASR / 媒体转换等能力引擎）
#   models     — 模型资产（ONNX 权重、whisper 模型）与本机模型服务通道（type: model_endpoint）
#   plugins    — 内置插件资产（vendored 前端库等；本清单当前未声明任何 vendored 插件，见
#                tests/workflow/test_capability_requirements_manifest.py 的已记录偏差）
#
# 字段说明（与 config/schemas/capability-requirements.schema.json 严格对应）：
#   name            唯一标识（小写连字符）
#   resource_id     稳定资源 ID（ext.<类别>.<名字>）；改名是破坏性变更，索引与消费方都用它
#   type            toolchain | runtime | engine | model | model_endpoint
#   purpose         用途（人类可读）
#   version_range   兼容范围（不锁死；semver 区间或自由文本，见 schema pattern）
#   version_identification  版本/身份**具体怎么确定**（哪个命令的第一行、哪个注册表值、
#                   哪个 /v1/models 字段），避免"看起来有版本"被当成已核实
#   platform        声明所适用的平台；本平台之外的解析必须给出具名 unavailable
#   license         **代码**许可（SPDX 或明确声明）
#   asset_license   权重/数据资产条款，与代码许可**分开**记录（缺省表示本条目无资产条款）
#   source_url      官方来源（https URL；内置资产可写 "vendored"）
#   install_method  scoop | uv | rustup | playwright-install | 下载安装器 |
#                   自动下载 | 内置 | uv-sync | system
#   external_paths  相对声明根的候选路径（不接受绝对路径与 `..`）
#   sibling_root    本条目相对哪个命名邻近根解析（见顶层 sibling_roots）
#   project_entry   项目内的**调用入口**（哪个函数按什么名字读它）；一处声明，处处同解
#   required_env    该资源真正运行所需的**进程级环境变量**，值为相对声明根的路径；
#                   绝对路径与 `..` 一律拒绝（rust 无 RUSTUP_HOME 会死、tesseract 无
#                   TESSDATA_PREFIX 会 abort，都是"文件在、跑不起来"的实测形状）
#   writability     shared_read_only | shared_writable_by_project | project_writable
#   healthcheck_command  健康检查命令（人类可读说明；真正执行由 probe 声明决定）
#   probe           绑定到具体可执行物/解释器/接口探针：kind + 参数 + 期望 + 该次通过
#                   **最高**能证明到哪一级（reaches: FILE_EXISTS | VERSION_PROBED |
#                   RESULT_VERIFIED）；跑不了的一律 kind: not_run 并写 reason
#   fallback        回退/恢复路径（这个资源不在时项目怎么办）
#   failure_message 资源不可用时消费者看到的具名信息
#   required_by     依赖方（哪些测试/流程）：ci | tests | core-runtime |
#                   desktop-build | desktop-runtime | browser-smoke | e2e |
#                   ocr-pipeline | asr-pipeline | conversion | bakeoff |
#                   file-detection | workspace-ui | media-pipeline
#   local_only      true = 必须在本机/本外部能力仓存在，不随项目分发、不自动安装
#
# verification_level 不在这里声明：它是**测出来的**，由索引生成器逐条执行 probe 后写入
# config/environment/external-resources-index.json（REGISTERED / FILE_EXISTS /
# VERSION_PROBED / RESULT_VERIFIED / NOT_RUN / unavailable）。本清单只声明 intent（
# probe.reaches = 该探针通过所能证明的上限），索引记录实测；两者不符时测试必须红。
# =============================================================================
schema_version: "1.0"
updated: "2026-10-08"
source_of_truth: "docs/environment/EXTERNAL_DEPENDENCIES.md"
description: "ArcheAxis-Knowledge-OS 外置能力需求规范（机器可读清单，四处读取方共用的唯一绑定）"

# 命名邻近根：与外置根同级、但不在其内的共享资源。共享 Model library 就是这一类。
# 条目通过 sibling_root 引用此处名字，external_paths 因此无需写 `..`；可到达的位置由本清单
# 显式命名，而不是由路径遍历决定。三处读取方（worker 解析器、宿主清点、外置索引）都按同一
# 规则解析，索引不再声称一个运行期无法到达的路径"存在"。
sibling_roots:
  model-library: "../Model library"

capabilities:
  toolchains:
    - name: python
      resource_id: ext.toolchains.python
      type: toolchain
      purpose: "主运行时解释器（3.11 主 / 3.14 辅，scoop 管理）"
      version_range: ">=3.11,<3.15"
      version_identification: "python --version 第一行"
      platform: windows-x64
      license: "PSF-2.0"
      source_url: "https://www.python.org/downloads/windows/"
      install_method: scoop
      external_paths: ["10-toolchains/scoop/apps/python/current/python.exe"]
      project_entry: "tool_paths.tool_path(\"python\")"
      writability: shared_read_only
      healthcheck_command: "python --version"
      probe:
        kind: command
        args: ["--version"]
        expect_pattern: "Python 3\\."
        reaches: VERSION_PROBED
      fallback: "声明缺失即具名失败；不猜 PATH，不自动安装"
      required_by: [core-runtime, ci, tests]
      local_only: false

    - name: uv
      resource_id: ext.toolchains.uv
      type: toolchain
      purpose: "依赖锁定、虚拟环境、包安装"
      version_range: ">=0.7"
      version_identification: "uv --version 第一行"
      platform: windows-x64
      license: "MIT OR Apache-2.0"
      source_url: "https://github.com/astral-sh/uv/releases"
      install_method: scoop
      # 本机实测：外置根内**没有** uv.exe（`find <root> -maxdepth 4 -name uv.exe` 为空），
      # 唯一可执行物是宿主自管的 `C:\Users\ALEX\.local\bin\uv.EXE`。所以这一条只能是
      # unbound_path_fallback：索引把它记为"未绑定"，而不是假装它属于项目声明。
      # 引擎条目也不再借用 uv 做探针（见 faster-whisper / rapidocr / sherpa-onnx）。
      healthcheck_command: "uv --version"
      project_entry: "无声明路径可绑：本机 uv 由宿主自管（`%USERPROFILE%\\.local\\bin`），项目只读取其答案"
      writability: shared_read_only
      probe:
        kind: command
        args: ["--version"]
        expect_pattern: "uv [0-9]+\\."
        reaches: VERSION_PROBED
      fallback: "uv 不在则 uv-sync 类条目（ci-venv）记 unavailable，改用已声明解释器直接跑探针"
      required_by: [core-runtime, ci, tests]
      local_only: false

    - name: dotnet
      resource_id: ext.toolchains.dotnet
      type: toolchain
      purpose: "Avalonia 供体（apps/ArcheAxis.Desktop）的构建与测试；SUP-022 后它是冻结的行为/组件供体，不是正式桌面壳"
      version_range: ">=10,<11"
      version_identification: "dotnet --version 第一行"
      platform: windows-x64
      license: "MIT OR proprietary runtime components"
      source_url: "https://dotnet.microsoft.com/download/dotnet/10.0"
      install_method: system
      healthcheck_command: "dotnet --version"
      external_paths: ["10-toolchains/dotnet/dotnet.exe"]
      project_entry: "tool_paths.tool_path(\"dotnet\")"
      writability: shared_read_only
      probe:
        kind: command
        args: ["--version"]
        expect_pattern: "^1[0-9]\\.0\\."
        reaches: VERSION_PROBED
      fallback: "供体构建不可用时只读源码，不产出双写数据库"
      required_by: [desktop-build, desktop-runtime]
      local_only: true

    - name: git
      resource_id: ext.toolchains.git
      type: toolchain
      purpose: "版本控制"
      version_range: ">=2.40"
      version_identification: "git --version 第一行"
      platform: windows-x64
      license: "GPL-2.0-only"
      source_url: "https://git-scm.com/download/win"
      install_method: scoop
      external_paths: ["10-toolchains/scoop/apps/git/current/bin/git.exe"]
      project_entry: "tool_paths.tool_path(\"git\")"
      writability: shared_read_only
      healthcheck_command: "git --version"
      probe:
        kind: command
        args: ["--version"]
        expect_pattern: "git version 2\\."
        reaches: VERSION_PROBED
      fallback: "声明缺失即具名失败；工作树身份仍由 scripts/runtime/dev.py 的 git 边界给出"
      required_by: [ci, tests, core-runtime]
      local_only: false

    - name: nodejs-lts
      resource_id: ext.toolchains.nodejs-lts
      type: toolchain
      purpose: "正式桌面宿主的构建运行时：SUP-022 下 frontend/ + src-tauri/（Tauri 2 + React/TypeScript/Vite）是正式产品宿主，node 驱动其安装、构建、Vitest 与 tauri 打包"
      version_range: ">=22,<25"
      version_identification: "node --version 第一行"
      platform: windows-x64
      license: "MIT"
      source_url: "https://nodejs.org/"
      install_method: scoop
      external_paths: ["10-toolchains/scoop/apps/nodejs-lts/current/node.exe"]
      project_entry: "tool_paths.tool_path(\"nodejs-lts\")"
      writability: shared_read_only
      healthcheck_command: "node --version"
      probe:
        kind: command
        args: ["--version"]
        expect_pattern: "^v2[2-4]"
        reaches: VERSION_PROBED
      fallback: "node 不可得时前端门不跑，具名报告 host 缺工具，不用其它解释器顶替"
      required_by: [desktop-build]
      local_only: false

    - name: rust
      resource_id: ext.toolchains.rust
      type: toolchain
      purpose: "正式宿主的 Rust Core 工具链：SUP-022 下 crates/ 的 Rust Core 是唯一的 SQLite/CAS 规范写入方，src-tauri/ 的正式桌面壳由它编译"
      version_range: ">=1.80"
      version_identification: "rustc --version 与 cargo --version 的第一行（同一个 toolchain 绑定下的两条读数必须一致）"
      platform: windows-x64
      license: "MIT OR Apache-2.0"
      source_url: "https://rustup.rs"
      install_method: rustup
      # 实测（2026-10-08，本机）三根冲突的真相：
      #   · 旧声明 `10-toolchains/cargo/bin/rustc.exe` **裸跑失败**：
      #     `error: Missing manifest in toolchain 'stable-x86_64-pc-windows-msvc'`（rc 1）——
      #     cargo/bin 下是 rustup 代理，不是独立编译器，它按 RUSTUP_HOME 找 toolchain；
      #   · 不设 RUSTUP_HOME 时 `cargo.exe --version` 竟答 **1.98.1**（宿主 `~/.rustup` 的
      #     默认通道），设了才答与 rustc 一致的 **1.97.1** —— 这就是同一个"rust 条目"下
      #     rustc 失败而 cargo 静默换版本；
      #   · `dev.py` 声明的是另一个根（`toolchains/rust`），`scripts/ci/cargo_test.bat:45-53`
      #     从 ARCHEAXIS_RUST_TOOLCHAINS 又推出第三个（RUSTUP_HOME/CARGO_HOME），而跑的恰恰是
      #     后两者。
      # 唯一绑定因此定在 `toolchains/rust`：它同时被两个代理证明可用（rustc 1.97.1 /
      # cargo 1.97.1），并且它的 `cargo/registry` 是 1.1GB 的暖缓存（`10-toolchains/cargo/registry`
      # 只有 207MB），换过去会在无网主机上触发重新下载。ARCHEAXIS_RUST_TOOLCHAINS = 该目录
      # （其下同时有 cargo/ 与 rustup/），正是 cargo_test.bat 已经展开的形状。
      external_paths: ["toolchains/rust/cargo/bin/rustc.exe", "toolchains/rust/cargo/bin/cargo.exe"]
      project_entry: "tool_paths.tool_path(\"rust\") + tool_paths.required_environment(\"rust\") -> dev.external_toolchain()"
      required_env:
        RUSTUP_HOME: "toolchains/rust/rustup"
        CARGO_HOME: "toolchains/rust/cargo"
      writability: shared_read_only
      healthcheck_command: "rustc --version && cargo --version（需 RUSTUP_HOME/CARGO_HOME，见 required_env）"
      probe:
        kind: command
        args: ["--version"]
        expect_pattern: "rustc 1\\.9[0-9]"
        also:
          - path: "toolchains/rust/cargo/bin/cargo.exe"
            args: ["--version"]
            expect_pattern: "cargo 1\\.9[0-9]"
        reaches: VERSION_PROBED
      fallback: "缺 RUSTUP_HOME 时按具名失败处理；不把 cargo/bin 下的代理当独立编译器，不回落到宿主 ~/.rustup（该树缺 manifest，正是失败来源），也不为凑版本换根"
      failure_message: "rust: declared toolchain did not answer (RUSTUP_HOME/CARGO_HOME from required_env are the binding; the proxies in toolchains/rust/cargo/bin resolve a toolchain only through RUSTUP_HOME)"
      required_by: [desktop-build]
      local_only: true

    - name: msvc
      resource_id: ext.toolchains.msvc
      type: toolchain
      purpose: "MSVC 编译链（VS Build Tools：C++ 桌面工作负载 + Windows SDK），为 Rust Core 提供 link.exe/cl.exe"
      version_range: ">=17.0"
      version_identification: "vcvars64.bat 初始化后 where cl.exe 得到的绝对路径中的 14.xx 版本目录"
      platform: windows-x64
      license: "Proprietary (Microsoft EULA)"
      source_url: "https://visualstudio.microsoft.com/visual-cpp-build-tools/"
      install_method: 下载安装器
      # 实测：`vcvars64.bat --version`（旧探针的做法）得到的是
      # `[ERROR:vcvarsall.bat] Invalid argument found`，被当成版本号记进 RESULT_VERIFIED。
      # 能成立的形式是**先 cd 进 Build 目录再用相对名 call**（绝对路径 call 在本机 rc 1：
      # "The filename, directory name, or volume label syntax is incorrect"），然后
      # `where cl.exe` → `...\MSVC\14.44.35207\bin\Hostx64\x64\cl.exe`，rc 0。
      external_paths: ["10-toolchains/msvc/VC/Auxiliary/Build/vcvars64.bat"]
      project_entry: "tool_paths.tool_path(\"msvc\") + dev.external_toolchain() -> ARCHEAXIS_MSVC_VCVARS"
      writability: shared_read_only
      # Codex's child PATH need not include System32; use the Windows-owned locator explicitly.
      healthcheck_command: 'cd /d <VC/Auxiliary/Build> && call vcvars64.bat && "%SystemRoot%\System32\where.exe" cl.exe'
      probe:
        kind: cmd_chain
        cwd: "10-toolchains/msvc/VC/Auxiliary/Build"
        lines: ["call vcvars64.bat", '"%SystemRoot%\System32\where.exe" cl.exe']
        expect_pattern: "cl\\.exe$"
        timeout_seconds: 120
        reaches: RESULT_VERIFIED
      fallback: "初始化失败即具名失败；不猜宿主 VSINSTALLDIR，也不改全局注册表"
      failure_message: "msvc: vcvars64.bat did not initialize, or cl.exe was not found after initialization (cwd-relative call is the form this host answers)"
      required_by: [desktop-build]
      local_only: true

    - name: playwright-chromium
      resource_id: ext.toolchains.playwright-chromium
      type: toolchain
      purpose: "browser-smoke / e2e 测试浏览器，亦是 F03 渲染通道使用的无头浏览器（缓存于 toolchains/playwright）"
      version_range: ">=1228"
      version_identification: "声明的构建目录名 chromium-1228 与该目录内 chrome.exe 的存在性。本机实测：Windows 版 chrome.exe --version **不报版本**（它输出的是一条会话占用提示，带 --user-data-dir 时直接拉起浏览器进程并因沙箱权限失败），所以这一条**不**以运行 chrome.exe 为探针，只证明被声明的那一个文件在位"
      platform: windows-x64
      license: "BSD-3-Clause (Chromium)"
      source_url: "https://playwright.dev/python/docs/browsers"
      install_method: playwright-install
      # 渲染通道要的是**这一个** exe：Playwright 只查自己的注册表，而会话把它指到一个
      # 空的 project-local 缓存，所以声明这条路径才是让 worker 找到已就位浏览器的办法。
      # 目录名带构建号（chromium-1228），升级 playwright 后若构建号变了，这一条会先失效——
      # 失效的表现是具名的"render engine missing"，不是拿别的浏览器顶替。
      external_paths: ["10-toolchains/playwright/chromium-1228/chrome-win64/chrome.exe"]
      project_entry: "tool_paths.tool_path(\"playwright-chromium\") / ARCHEAXIS_CHROMIUM_CMD override"
      writability: shared_read_only
      healthcheck_command: "chrome.exe present at the declared build directory"
      probe:
        kind: path_exists
        paths: ["10-toolchains/playwright/chromium-1228/chrome-win64/chrome.exe"]
        reaches: FILE_EXISTS
      fallback: "构建号不符则报具名缺失；不自动 playwright install，不使用系统 Edge 顶替，不为探版本而拉起浏览器"
      required_by: [browser-smoke, e2e, conversion]
      local_only: true

  runtimes:
    - name: webview2-evergreen
      resource_id: ext.runtimes.webview2-evergreen
      type: runtime
      purpose: "桌面宿主 WebView2 运行时（Evergreen 自动更新，OS 级）；SUP-022 下正式宿主是 Tauri 2，WebView2 仍是 Edge/WebView 通道的系统运行时"
      version_range: "evergreen"
      version_identification: "EdgeUpdate Clients 键的 pv 值（winreg 读 HKLM，回退 HKCU）"
      platform: windows-x64
      license: "Proprietary (Microsoft)"
      source_url: "https://developer.microsoft.com/microsoft-edge/webview2/"
      install_method: system
      # 旧 healthcheck 是一条 PowerShell Get-ItemProperty，Python 侧无法执行 → 永远被记成
      # "missing"，而它其实装着（本机实测 pv=154.0.4258.62）。改成注册表探针。
      healthcheck_command: "HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\EdgeUpdate\\Clients\\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5} pv"
      project_entry: "scripts/workflow/environment_registry.py probe kind registry_key（winreg，不经 PowerShell）"
      writability: project_writable
      probe:
        kind: registry_key
        hive: HKLM
        fallback_hive: HKCU
        key: "SOFTWARE\\WOW6432Node\\Microsoft\\EdgeUpdate\\Clients\\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
        value: pv
        expect_pattern: "^[0-9]+\\.[0-9]+"
        reaches: VERSION_PROBED
      fallback: "注册表读不到即具名 unavailable（该主机没有 Evergreen 运行时），不再谎报 missing"
      failure_message: "webview2-evergreen: EdgeUpdate Clients pv not present in HKLM or HKCU on this host"
      required_by: [desktop-runtime]
      local_only: true

    - name: archeaxis-ci-venv
      resource_id: ext.runtimes.archeaxis-ci-venv
      type: runtime
      purpose: "CI/开发虚拟环境（UV_PROJECT_ENVIRONMENT 指向外部仓）；引擎探针用它**自己的** python 跑，不再借 uv 顶替"
      version_range: "python>=3.11"
      version_identification: "<ci-venv>/Scripts/python.exe --version 第一行"
      platform: windows-x64
      license: "n/a"
      source_url: "n/a"
      install_method: uv-sync
      external_paths: ["ArcheAxis-Knowledge-OS-ci-venv/Scripts/python.exe"]
      project_entry: "tool_paths.tool_path(\"archeaxis-ci-venv\")"
      writability: shared_writable_by_project
      healthcheck_command: "<ci-venv>/Scripts/python.exe --version"
      probe:
        kind: command
        args: ["--version"]
        expect_pattern: "Python 3\\.1[0-9]"
        reaches: VERSION_PROBED
      fallback: "环境不在则引擎条目一并记 unavailable 并具名解释器；不新建第二份库副本"
      required_by: [ci, tests]
      local_only: true

    - name: desktop-runtime-v1
      resource_id: ext.runtimes.desktop-runtime-v1
      type: runtime
