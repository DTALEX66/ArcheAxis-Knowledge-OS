      license: "n/a"
      source_url: "n/a"
      install_method: 内置
      # 旧 healthcheck 是 PowerShell `Test-Path ...`，Python 跑不了 → 记成 missing。
      # 现在用 path_exists 探针，走同一个声明根；本机实测 20-runtimes/ 为空目录，
      # 该运行时在 2026-08-07 审计清理中已移出外置根，所以这条的正确结论是
      # **unavailable（声明的路径不存在）**，而不是"探针跑不了所以缺失"。
      healthcheck_command: "path exists: 20-runtimes/desktop-runtime-v1"
      project_entry: "scripts/workflow/environment_registry.py probe kind path_exists"
