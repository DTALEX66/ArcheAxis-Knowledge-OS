        reaches: FILE_EXISTS
      fallback: "缺失时 WebView2/系统通道继续用；不重新下载该 349MB 运行时，也不伪造其存在"
      failure_message: "desktop-runtime-v1: declared path 20-runtimes/desktop-runtime-v1 is not present under the external root (removed by the 2026-08-07 audit cleanup)"
      required_by: [desktop-runtime]
      local_only: true

  engines:
    - name: tesseract
      resource_id: ext.engines.tesseract
      type: engine
      purpose: "图像 OCR 引擎（scoop 5.5.0 + leptonica 1.85.0）"
      version_range: ">=5.0,<6"
      version_identification: "tesseract --version 第一行（含 leptonica 行）"
      platform: windows-x64
      license: "Apache-2.0"
      source_url: "https://github.com/UB-Mannheim/tesseract/wiki"
      install_method: scoop
      external_paths: ["10-toolchains/scoop/apps/tesseract/current/tesseract.exe"]
      project_entry: "tool_paths.tool_path(\"tesseract\") + tool_paths.required_environment(\"tesseract\")"
      # AGENTS.md §7：扫描版 PDF 需要 OCR 且要求 TESSDATA_PREFIX 已设。此前**没有一处读取方**
      # 声明它。实测形状：裸 tesseract 的 `--list-langs` 直接
      # `terminate called … filesystem_error: directory iterator cannot advance`（rc 3），
      # 设了 TESSDATA_PREFIX 才报 163 种语言并对探针图返回 ‘Arche Axis OCR PROBE 42。
      required_env:
        TESSDATA_PREFIX: "10-toolchains/scoop/apps/tesseract-languages/current"
      writability: shared_read_only
      healthcheck_command: "tesseract --version && tesseract --list-langs（需 TESSDATA_PREFIX）"
      probe:
        kind: ocr_roundtrip
        expect_pattern: "ARCHEAXIS OCR PROBE 42"
        min_languages: 3
        timeout_seconds: 120
        reaches: RESULT_VERIFIED
      fallback: "TESSDATA_PREFIX 声明路径不存在 → 具名 unavailable（AGENTS.md §7 的 OCR 前置不成立），不退回语言包缺失的裸引擎"
      failure_message: "tesseract: engine present but OCR did not round-trip the probe string (check TESSDATA_PREFIX from required_env)"
      required_by: [ocr-pipeline, conversion]
      local_only: false

    - name: tesseract-languages
      resource_id: ext.engines.tesseract-languages
      type: engine
      purpose: "Tesseract 语言包（chi_sim 中文简体 + eng 英文；TESSDATA_PREFIX 指向 4.1.0 目录）"
      version_range: "4.1.0"
      version_identification: "tesseract --list-langs 首行的语言计数（本机实测 163）"
      platform: windows-x64
      license: "Apache-2.0"
      source_url: "https://github.com/tesseract-ocr/tessdata"
      install_method: scoop
      external_paths: ["10-toolchains/scoop/apps/tesseract-languages/current"]
      project_entry: "tool_paths.tool_path(\"tesseract-languages\") = TESSDATA_PREFIX 的值"
      writability: shared_read_only
      healthcheck_command: "tesseract --list-langs（以 tesseract 为解释器、以本目录为 TESSDATA_PREFIX）"
      # 目录本身不能满足版本探针（旧代码对目录跑 --version → probe_failed 却被记成 available）。
      # 这一条的真探针是：用它作为 TESSDATA_PREFIX、用 tesseract.exe 跑 --list-langs。
      probe:
        kind: list_langs
        interpreter: tesseract
        expect_pattern: "available languages in .* \\(([0-9]+)\\)"
        require_values: [eng, chi_sim]
        reaches: RESULT_VERIFIED
      fallback: "语言包缺失则 OCR 只能跑内建语言；不下载语言包，不把 eng 当三语种能力"
      required_by: [ocr-pipeline]
      local_only: false

    # R15/F14 `.doc`：antiword 是**旁路引擎**，本项目不打包、不代装、不改许可。
    # 两条必须一起声明：antiword 只到 $HOME/.antiword 与 /usr/share/antiword 找字符映射表，
    # 而 -m 传绝对路径会被截断后用默认表（实测），所以搬出安装目录的副本必须配一个
    # 名为 .antiword 的映射目录，并把其父目录作为 HOME 交给引擎。只声明二进制那一条，
    # 解析成功而读取失败。
    - name: antiword
      resource_id: ext.engines.antiword
      type: engine
      purpose: "Word 97 .doc 纯文本旁路读取（MSYS2 打包 antiword 0.37；健康检查以 -h 自报身份，退出码非 0 是该引擎的正常行为）"
      version_range: "0.37"
      version_identification: "antiword -h 的用法输出首行（该引擎不以退出码 0 表达成功）"
      platform: windows-x64
      license: "GPL-3.0-or-later"
      source_url: "https://github.com/msys2/MINGW-packages/tree/master/mingw-w64-antiword"
      install_method: system
      external_paths: ["10-toolchains/antiword/antiword.exe"]
      project_entry: "tool_paths.tool_path(\"antiword\") / ARCHEAXIS_ANTIWORD_CMD override"
      required_env:
        HOME: "10-toolchains/antiword"
      writability: shared_read_only
      healthcheck_command: "antiword -h"
      probe:
        kind: command
        args: ["-h"]
        expect_pattern: "antiword"
        accept_rc: [0, 1, 2]
        reaches: VERSION_PROBED
      fallback: "映射表缺失时 .doc 走 Tika/其它旁路；不放宽 HOME 到用户主目录"
      required_by: [conversion]
      local_only: true

    - name: antiword-mappings
      resource_id: ext.engines.antiword-mappings
      type: engine
      purpose: "antiword 字符映射表目录（目录名必须为 .antiword；worker 把它的父目录作为 HOME 交给引擎，否则搬出安装目录的副本读不到 UTF-8.txt 就拒绝出文）"
      version_range: "0.37"
      version_identification: "UTF-8.txt 映射文件存在性（目录名 + 文件名共同构成身份）"
      platform: windows-x64
      license: "GPL-3.0-or-later"
      source_url: "https://github.com/msys2/MINGW-packages/tree/master/mingw-w64-antiword"
      install_method: system
      external_paths: ["10-toolchains/antiword/.antiword"]
      project_entry: "tool_paths.tool_path(\"antiword-mappings\") 的父目录 = antiword 的 HOME"
      writability: shared_read_only
      healthcheck_command: "mapping file present: 10-toolchains/antiword/.antiword/UTF-8.txt"
      probe:
        kind: path_exists
        paths: ["10-toolchains/antiword/.antiword/UTF-8.txt"]
        reaches: FILE_EXISTS
      fallback: "缺 UTF-8.txt 即具名拒绝出文，不回落到默认映射给出乱码"
      required_by: [conversion]
      local_only: true

    # R15/F14 `.ppt`：Apache Tika 是 Java 程序，所以这一族需要**两条一起**声明——JVM 与 jar。
    # 只声明 jar 会得到"解析成功而跑不起来"，形状与 antiword 缺映射表完全一致。
    # 许可不是凭印象写的：两者都从**分发自带的许可文件**读出来（Tika 的 LICENSE 是 Apache-2.0，
    # Zulu 的 legal/java.base 里同时有 GPL 全文与 ASSEMBLY_EXCEPTION）。
    - name: zulu-jre
