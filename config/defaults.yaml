# Public, non-secret baseline for every runtime profile.
app:
  name: "archeaxis-workspace"
  version: "0.6.3"
  release_version: ""
  environment: "development"
  port: 8000
  host: "127.0.0.1"

database:
  path: "data/archeaxis.sqlite"
  journal_mode: "WAL"
  backup_dir: "data/backups"

logging:
  level: "INFO"
  console: true
  file: true
  file_dir: "data/logs"
  rotation: "10 MB"
  retention: "7 days"

auth:
  enabled: false
  token_expire_hours: 24

rate_limit:
  enabled: true
  window_seconds: 60
  ordinary_read: 200
  sensitive_write: 30
  auth_token: 5
  max_buckets_per_policy: 10000
  trusted_proxies: []

pipeline:
  max_content_chars: 10000
  default_actions: ["extract", "tag", "summarize", "index"]
  auto_ingest: true

search:
  fts5_enabled: true
  vector_enabled: true
  vector_dim: 384
  default_top_k: 5

cors:
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "DELETE"]
  allow_headers: ["Authorization", "Content-Type", "X-API-Key"]

# Optional LLM-assisted refinements. Empty model = local/deterministic only.
learning:
  teach_back:
    llm_model: ""          # e.g. "ollama/llama3.1" or any LiteLLM model
  quiz:
    llm_model: ""

rag:
  embedding:
    provider: "local"      # local | llm
    model: ""              # e.g. "text-embedding-3-small" (LiteLLM)
