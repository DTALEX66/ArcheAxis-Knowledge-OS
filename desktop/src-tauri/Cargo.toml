[package]
name = "archeaxis-desktop-shell"
version = "0.6.14"
edition = "2024"
rust-version = "1.88"

[lib]
name = "archeaxis_desktop_shell"
path = "src/lib.rs"

[[bin]]
name = "archeaxis-desktop-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2"
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.26.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
# The root workspace excludes this crate on purpose, so the crate has to declare its own workspace
# root. Without this cargo refuses the manifest as being in a workspace when it is not, which is why
# the Tauri host could not be checked or built at all.
[workspace]
