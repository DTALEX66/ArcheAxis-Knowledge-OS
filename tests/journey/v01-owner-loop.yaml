    not_verified: >-
      Code signing, installer/uninstaller lifecycle, clean-Windows-machine first
      use and real Green install acceptance need controlled Windows packaging
      resources; this step stays BLOCKED until they are available.
    evidence:
      - docs/current/R5-HANDOFF-20260918.md
      - docs/current/R5-STATE.json
