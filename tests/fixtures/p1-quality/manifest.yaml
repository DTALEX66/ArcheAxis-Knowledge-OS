fixture_id: p1-quality-matrix
purpose: DP-NF-03 P1 document format quality matrix through the real text worker and NDJSON transport
synthetic: true
real_corpus: false
byte_exact: >-
  this directory carries its own .gitattributes (`* -text`) because the repository root
  declares `* text=auto eol=lf`; without it the two CRLF fixtures would be normalized on
  commit and the SHA-256 values below would no longer describe the stored bytes.
note: >-
  Every byte here is authored by hand for this matrix. DP-F01 covers a different,
  already-pinned set (BOM markdown 17 lines, 5001-line BOM cap, LF GBK fallback,
  one short ragged row, unknown extension). This manifest is evidence for a
  controlled synthetic matrix only: it is NOT real-corpus qualification, it closes
  no P1 format, and it makes no claim about common-format real quality.
  Two further inputs are generated inside the pytest run root instead of being
  committed, because they are large: a single line of 1 MiB + 1 bytes (accepted;
  exactly one anchor) and a 16 MiB + 1 byte staging asset (refused by the transport
  with AAK-VAL-003 before anything is projected).
files:
  - name: clean-markdown.md
    media_type: text/markdown
    encoding: utf-8
    line_endings: lf
    source_bytes: 131
    source_sha256: d1cffdcd99038a5bede95502efaf069df1f1724a1f774ac1e7b5f646fef39a19
    text_chars: 127
    transform_is_source_identity: true
    lines_total: 12
    lines_anchored_expected: 12
    expected_decode: utf-8
    expected_losses: []
    expected_headings: 1
    expected_code_fences: 2
    expected_wiki_links: 1
    expected_markdown_links: 1
    expected_list_items: 2
    note: >-
      no BOM and no fallback, so the projected text is the source byte for byte; a
      "~~~" fence pair is counted, the "#" heading inside it and the "#notaheading"
      line are not
