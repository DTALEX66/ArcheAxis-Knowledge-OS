name: vnext-ci

# ArcheAxis vNext continuous integration (DIRECTORY_AUTHORITY:
# .github/workflows/vnext-ci.yml). Runs the Rust workspace tests on Windows.
# The v0.1 closed-loop receipt is produced by the journey test when
# VNEXT_RECEIPT_OUT is set.

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-toolchain.toml"
      - "apps/ArcheAxis.Desktop/**"
      - "services/python-workers/**"
      - "packages/contracts/**"
      - "scripts/runtime/**"
      - "tests/runtime-paths/**"
      - "tests/workers/**"
      - "tests/contract/**"
      - "scripts/contracts/**"
      - "scripts/ci/check_vnext_*.py"
      - "Directory.Build.props"
      - ".github/workflows/vnext-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ArcheAxis.Desktop/**"
      - "services/python-workers/**"
      - "packages/contracts/**"
      - "scripts/runtime/**"
      - "tests/runtime-paths/**"
      - "tests/workers/**"
      - "tests/contract/**"
      - "scripts/contracts/**"
      - "scripts/ci/check_vnext_*.py"
      - "Directory.Build.props"
      - ".github/workflows/vnext-ci.yml"

jobs:
  cargo-test:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Initialize project development paths
        run: python -B scripts/runtime/dev.py --github-env
      - name: Reject generated vocabulary drift
        run: python -B scripts/contracts/generate_vocabulary.py --check
      - name: Parse shared vocabulary wire cases with Python
        run: python -B -m unittest discover -s tests/contract -p "test_vocabulary_generation.py"

      - name: Install Rust (stable, from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: cargo test (workspace)
        shell: bash
        run: cargo test --workspace
      - name: Verify v0.1 receipt produced
        run: python -B scripts/ci/check_vnext_receipt.py
      - name: Avalonia desktop build (Supervisor shell)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: dotnet build ArcheAxis.Desktop
        shell: bash
        run: dotnet build apps/ArcheAxis.Desktop/ArcheAxis.Desktop.csproj -v minimal
      - name: Parse shared vocabulary wire cases with the C# production binding
        run: dotnet run --project tests/contract/Vocabulary.Tests -- tests/contract/fixtures/vocabulary-cases.json
      - name: cargo build core server (for supervisor smoke)
        shell: bash
        run: cargo build -p archeaxis-api
      - name: Supervisor isolation and bounded startup regressions
        env:
          ARCHAXIS_CORE_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/archeaxis-api.exe
        run: dotnet run --project tests/runtime-paths/CoreSupervisor.Tests
      - name: Supervisor smoke (Avalonia spawns Rust core, handshake, cleanup)
        shell: bash
        env:
          ARCHAXIS_CORE_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/archeaxis-api.exe
        run: |
          dotnet run --project apps/ArcheAxis.Desktop -- --smoke \
            && echo "supervisor smoke OK"
