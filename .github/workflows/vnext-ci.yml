name: vnext-ci

# ArcheAxis vNext continuous integration (DIRECTORY_AUTHORITY:
# .github/workflows/vnext-ci.yml). Runs selected Windows diagnostics or builds candidate inputs.
# The v0.1 closed-loop receipt is produced by the journey test when
# VNEXT_RECEIPT_OUT is set.

on:
  # The canonical CI owns automatic vNext checks; this is a diagnostic lane.
  workflow_dispatch:
    inputs:
      suite:
        description: Windows diagnostic or candidate build suite
        type: choice
        default: workspace
        options:
          - workspace
          - siyuan-block-attachment
          - windows-release-core
          - frontend-dist

concurrency:
  group: vnext-diagnostic-${{ github.ref }}${{ inputs.suite != 'workspace' && format('-{0}', inputs.suite) || '' }}
  cancel-in-progress: true

jobs:
  cargo-test:
    if: ${{ inputs.suite == 'workspace' }}
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Initialize project development paths
        run: python -B scripts/runtime/dev.py --github-env
      - name: Set up locked Python dependency tooling
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: false
      - name: Prepare isolated Python workers from the lockfile
        shell: pwsh
        run: |
          $workerEnv = Join-Path $env:ARCHEAXIS_RUN_ROOT 'worker-env'
          $workerPython = Join-Path $workerEnv 'Scripts/python.exe'
          $requirements = Join-Path $env:ARCHEAXIS_RUN_ROOT 'artifacts/locked-ci.txt'
          uv venv --python $env:ARCHEAXIS_PYTHON $workerEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv export --frozen --only-group ci --no-emit-project --format requirements-txt --output-file $requirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python $workerPython --require-hashes -r $requirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # cargo test --workspace exercises the real workers, including formats that need the
          # adapter engines (the xlsx worker needs openpyxl). ci.yml installs this group as well;
          # without it the workspace run dies with AAK-WORKER-003 "engine missing" even though the
          # engine is declared, because the isolated worker venv never received it.
          $adapters = Join-Path $env:ARCHEAXIS_RUN_ROOT 'artifacts/locked-ci-adapters.txt'
          uv export --frozen --only-group ci-adapters --no-emit-project --format requirements-txt --output-file $adapters
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python $workerPython --require-hashes -r $adapters
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $workerPython -B -c 'import openpyxl; from importlib.metadata import version; print("openpyxl=" + version("openpyxl"))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $workerPython -B -c 'import sys, fsrs; from importlib.metadata import version; print(sys.executable); print("fsrs=" + version("fsrs"))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ARCHEAXIS_PYTHON=$workerPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify isolated scheduling worker and restart state
        shell: pwsh
        run: '& $env:ARCHEAXIS_PYTHON -B -m pytest tests/test_worker_schedule.py -q'
      - name: Reject generated vocabulary drift
        run: python -B scripts/contracts/generate_vocabulary.py --check
      - name: Reject media window policy drift
        run: python -B scripts/contracts/check_media_window_policy.py --check
      - name: Parse shared vocabulary wire cases with Python
        run: python -B -m unittest discover -s tests/contract -p "test_vocabulary_generation.py"

      - name: Install Rust (stable, from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Set up Node for the OpenMAIC scene worker
        uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7
        with:
          node-version: '24.21.0'
      - name: DeepTutor synthetic practice through Python and Core
        shell: pwsh
        run: cargo test --locked -p archeaxis-api --test deeptutor_practice_import -- --ignored
      - name: OpenMAIC synthetic scene through Node and Core
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          $env:ARCHEAXIS_TEST_NODE = (Get-Command node.exe -ErrorAction Stop).Source
          $env:ARCHEAXIS_TEST_NODE_SHA256 = (Get-FileHash -LiteralPath $env:ARCHEAXIS_TEST_NODE -Algorithm SHA256).Hash.ToLowerInvariant()
          cargo test --locked -p archeaxis-api --test openmaic_scene_runtime -- --ignored
      - name: Prepare pinned project-local OCR for Rust worker tests
        shell: pwsh
        run: |
          $sevenzip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenzip) { $sevenzip = 'C:/Program Files/7-Zip/7z.exe' }
          $ocrRoot = Join-Path $env:ARCHEAXIS_RUN_ROOT 'rust-worker-ocr'
          python -B scripts/ci/prepare_windows_ocr.py --project-root "$env:GITHUB_WORKSPACE" --root "$ocrRoot" --sevenzip "$sevenzip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: cargo test (workspace)
        shell: bash
        run: cargo test --workspace --locked
      - name: Verify v0.1 receipt produced
        run: python -B scripts/ci/check_vnext_receipt.py
      - name: Avalonia desktop build (Supervisor shell)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: dotnet build ArcheAxis.Desktop
        shell: bash
        run: dotnet build apps/ArcheAxis.Desktop/ArcheAxis.Desktop.csproj -v minimal
      - name: Parse shared vocabulary wire cases with the C# production binding
        run: dotnet run --project tests/contract/Vocabulary.Tests -- tests/contract/fixtures/vocabulary-cases.json
      - name: cargo build core server (for supervisor smoke)
        shell: bash
        run: cargo build -p archeaxis-api
      - name: Supervisor isolation and bounded startup regressions
        env:
          ARCHAXIS_CORE_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/archeaxis-api.exe
        run: dotnet run --project tests/runtime-paths/CoreSupervisor.Tests
      - name: Supervisor smoke (Avalonia spawns Rust core, handshake, cleanup)
        shell: bash
        env:
          ARCHAXIS_CORE_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/archeaxis-api.exe
        run: |
          mkdir -p .project-local/task-runtime/vnext-ci
          dotnet run --project apps/ArcheAxis.Desktop -- --smoke \
            "$GITHUB_WORKSPACE/.project-local/task-runtime/vnext-ci/smoke.sqlite" \
            && echo "supervisor smoke OK"

  siyuan-block-attachment:
    if: ${{ inputs.suite == 'siyuan-block-attachment' }}
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for the SiYuan text worker
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Initialize project development paths
        run: python -B scripts/runtime/dev.py --github-env
      - name: Install Rust (stable, from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
      - name: Verify the SiYuan block attachment reopens through Core
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $testName = 'native_siyuan_block_resolves_only_its_imported_batch_asset_after_reopen'
          $output = cargo test --locked -p archeaxis-api --test file_format_qualification $testName -- --exact 2>&1
          $cargoExit = $LASTEXITCODE
          $output | Write-Output
          if ($cargoExit -ne 0) { exit $cargoExit }
          $resultLine = '^test ' + [regex]::Escape($testName) + ' \.\.\. ok$'
          if (-not ($output -cmatch $resultLine) -or
              -not ($output -cmatch '^test result: ok\. 1 passed; 0 failed; 0 ignored;')) {
            throw "Expected one passing test named $testName."
          }

  windows-release-core:
    if: ${{ inputs.suite == 'windows-release-core' }}
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Initialize project development paths
        run: python -B scripts/runtime/dev.py --github-env
      - name: Install Rust (stable, from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
      - name: Build the locked Windows release Core
        shell: pwsh
        run: |
          cargo build --locked --release -p archeaxis-api --bin archeaxis-api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record the exact source and executable digests
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:GITHUB_SHA) { throw 'Core checkout commit mismatch' }
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changes = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $changes) { throw 'Core build changed tracked files' }
          $rustc = @(rustc -vV)
          if ($LASTEXITCODE -ne 0 -or $rustc -cnotcontains 'host: x86_64-pc-windows-msvc') { throw 'Expected the Windows x64 MSVC Rust toolchain' }
          $binary = Get-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/archeaxis-api.exe')
          $artifactRoot = Join-Path $env:ARCHEAXIS_RUN_ROOT 'artifacts/windows-release-core'
          New-Item -ItemType Directory -Path $artifactRoot | Out-Null
          $artifactBinary = Join-Path $artifactRoot $binary.Name
          Copy-Item -LiteralPath $binary.FullName -Destination $artifactBinary
          [ordered]@{
            schema = 'archeaxis/windows-release-core/v1'
            commit = $commit
            tree = $tree
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            target = 'x86_64-pc-windows-msvc'
            profile = 'release'
            rustc = $rustc[0]
            cargo_lock_sha256 = (Get-FileHash -LiteralPath Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
            executable = [ordered]@{
              name = $binary.Name
              bytes = $binary.Length
              sha256 = (Get-FileHash -LiteralPath $artifactBinary -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          } | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath (Join-Path $artifactRoot 'windows-release-core.json') -Encoding utf8
      - name: Upload the release Core and its identity
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          name: windows-release-core-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.ARCHEAXIS_RUN_ROOT }}/artifacts/windows-release-core/archeaxis-api.exe
            ${{ env.ARCHEAXIS_RUN_ROOT }}/artifacts/windows-release-core/windows-release-core.json
          if-no-files-found: error
          retention-days: 7

  frontend-dist:
    if: ${{ inputs.suite == 'frontend-dist' }}
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Initialize project development paths
        run: python -B scripts/runtime/dev.py --github-env
      - uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck and compile the canonical frontend
        shell: pwsh
        run: |
          npm ci --prefix frontend --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $env:ARCHEAXIS_FRONTEND_BUILD_CONTEXT = $env:ARCHEAXIS_RUN_ROOT
          python -B scripts/runtime/frontend.py --node $node build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive the generated assets and record their identity
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:GITHUB_SHA) { throw 'Frontend checkout commit mismatch' }
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changes = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $changes) { throw 'Frontend build changed tracked files' }
          if (-not (Test-Path -LiteralPath (Join-Path $env:ARCHEAXIS_FRONTEND_DIST 'index.html') -PathType Leaf)) { throw 'Frontend dist is missing its entry point' }
          $archive = Join-Path $env:ARCHEAXIS_RUN_ROOT 'artifacts/frontend-dist.zip'
          Compress-Archive -LiteralPath $env:ARCHEAXIS_FRONTEND_DIST -DestinationPath $archive -CompressionLevel Optimal
          [ordered]@{
            schema = 'archeaxis/frontend-dist/v1'
            commit = $commit
            tree = $tree
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            package_lock_sha256 = (Get-FileHash -LiteralPath 'frontend/package-lock.json' -Algorithm SHA256).Hash.ToLowerInvariant()
            archive = [ordered]@{
              name = 'frontend-dist.zip'
              entry = 'frontend-dist/index.html'
              bytes = (Get-Item -LiteralPath $archive).Length
              sha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          } | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath (Join-Path $env:ARCHEAXIS_RUN_ROOT 'artifacts/frontend-dist.json') -Encoding utf8
      - name: Upload the frontend archive and its identity
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          name: frontend-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.ARCHEAXIS_RUN_ROOT }}/artifacts/frontend-dist.zip
            ${{ env.ARCHEAXIS_RUN_ROOT }}/artifacts/frontend-dist.json
          if-no-files-found: error
          retention-days: 7
