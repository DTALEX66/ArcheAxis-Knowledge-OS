name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Require tag target to equal main
        shell: pwsh
        run: |
          if ((git rev-parse origin/main).Trim() -ne $env:GITHUB_SHA) {
            throw "release tag must point to the current main commit"
          }
      - name: Require successful exact-SHA CI
        id: require_ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ciRuns = @(
            gh run list --commit $env:GITHUB_SHA --workflow CI --limit 100 `
              --json databaseId,headSha,conclusion,status,url,workflowName,createdAt | ConvertFrom-Json
          )
          $successfulRuns = @($ciRuns | Where-Object {
            $_.workflowName -eq "CI" -and
            $_.headSha -eq $env:GITHUB_SHA -and
            $_.status -eq "completed" -and
            $_.conclusion -eq "success"
          } | Sort-Object createdAt -Descending)
          if ($successfulRuns.Count -lt 1) {
            throw "exact-SHA CI did not complete successfully"
          }
          $verificationRun = $successfulRuns[0]
          $canonicalRunUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$($verificationRun.databaseId)"
          "verification_run_id=$($verificationRun.databaseId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "verification_run_url=$canonicalRunUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked build tooling
        run: uv sync --frozen
      - name: Resolve and verify release version
        id: resolve_version
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "tag must be vX.Y.Z, got: $env:GITHUB_REF_NAME"
          }
          $pyVersion = [regex]::Match((Get-Content pyproject.toml -Raw), '^version\s*=\s*"([^"]+)"', 'Multiline').Groups[1].Value
          $pkgVersion = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $sources = [ordered]@{
            'pyproject.toml' = $pyVersion
            'package.json' = $pkgVersion
            'tauri.conf.json' = $tauriVersion
          }
          foreach ($entry in $sources.GetEnumerator()) {
            if ($entry.Value -ne $releaseVersion) {
              throw "version drift: tag=$releaseVersion but $($entry.Key)=$($entry.Value)"
            }
          }
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Release version verified: $releaseVersion (tag/pyproject/package.json/tauri.conf.json all agree)"
      - name: Install locked frontend tooling
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare bundled runtime and inject exact release identity
        shell: pwsh
        run: |
          python -m desktop.scripts.prepare_bundle --repository . --destination .hermes/rt
          $tree = git rev-parse "$env:GITHUB_SHA^{tree}"
          $uvLockHash = (Get-FileHash uv.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          $npmLockHash = (Get-FileHash frontend/package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
          $cargoLockHash = (Get-FileHash src-tauri/Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          python scripts/release_inject_identity.py `
            --commit $env:GITHUB_SHA `
            --tree $tree `
            --tag $env:GITHUB_REF_NAME `
            --version ${{ steps.resolve_version.outputs.release_version }} `
            --schema-version 3.0.0 `
            --url "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME" `
            --verification-ci-run-id ${{ steps.require_ci.outputs.verification_run_id }} `
            --verification-ci-url ${{ steps.require_ci.outputs.verification_run_url }} `
            --artifact-names "ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Setup.exe,ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Green.zip,ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Portable.zip,archeaxis_workspace-${{ steps.resolve_version.outputs.release_version }}-py3-none-any.whl,release-identity.json,release-manifest.json,SBOM.cdx.json,THIRD_PARTY_NOTICES.txt,SHA256SUMS.txt" `
            --dependency-locks "uv.lock=$uvLockHash,frontend/package-lock.json=$npmLockHash,src-tauri/Cargo.lock=$cargoLockHash" `
            --output .hermes/rt/runtime/release-identity.json
      - name: Build Windows NSIS installer
        run: frontend/node_modules/.bin/tauri.cmd build --config src-tauri/tauri.conf.json --bundles nsis
      - name: Verify installed NSIS lifecycle
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS installer, found $($installers.Count)" }
          ./desktop/scripts/verify_nsis_install.ps1 -Installer $installers[0].FullName -RequireReleaseIdentity
      - name: Build release wheel, installer, and distribution archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          uv build --wheel --out-dir release-assets
          $wheel = @(Get-ChildItem "release-assets/*.whl")
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
          if ($wheel.Count -ne 1 -or $installers.Count -ne 1) { throw "expected one wheel and one NSIS installer" }
          Get-ChildItem release-assets -Force -File |
            Where-Object Name -eq '.gitignore' |
            Remove-Item -Force
          $installerAsset = Join-Path release-assets "ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Setup.exe"
          Copy-Item $installers[0].FullName $installerAsset
          Copy-Item .hermes/rt/runtime/release-identity.json release-assets/
          # AXW-PKG-602/603: Green and Portable ZIPs assembled from the SAME
          # verified runtime as the installer; AXW-SUP-703 SBOM from locks.
          python desktop/scripts/assemble_distributions.py `
            --exe src-tauri/target/release/ArcheAxis.exe `
            --runtime .hermes/rt/runtime `
            --frontend frontend/dist `
            --identity .hermes/rt/runtime/release-identity.json `
            --out release-assets `
            --version ${{ steps.resolve_version.outputs.release_version }}
      - name: Verify Green and Portable lifecycle
        shell: pwsh
        run: |
          ./desktop/scripts/verify_zip_distributions.ps1 `
            -GreenArchive (Join-Path release-assets "ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Green.zip") `
            -PortableArchive (Join-Path release-assets "ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Portable.zip") `
            -RequireReleaseIdentity
      - name: Build release metadata and checksums
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem "release-assets/*.whl")
          $installerAsset = Join-Path release-assets "ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Setup.exe"
          if ($wheel.Count -ne 1 -or -not (Test-Path -LiteralPath $installerAsset -PathType Leaf)) {
            throw "release payloads are missing after distribution lifecycle verification"
          }
          python scripts/release_sbom.py `
            --version ${{ steps.resolve_version.outputs.release_version }} `
            --out release-assets/SBOM.cdx.json `
            --notices-out release-assets/THIRD_PARTY_NOTICES.txt
          python scripts/release_manifest.py `
            --version ${{ steps.resolve_version.outputs.release_version }} `
            --assets release-assets `
            --out release-assets/release-manifest.json
          python scripts/release_checksum.py --wheel $wheel[0].FullName --installer $installerAsset `
            --artifact release-assets/release-identity.json `
            --artifact (Join-Path release-assets "ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Green.zip") `
            --artifact (Join-Path release-assets "ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Portable.zip") `
            --artifact release-assets/SBOM.cdx.json `
            --artifact release-assets/release-manifest.json `
            --artifact release-assets/THIRD_PARTY_NOTICES.txt `
            --output release-assets/SHA256SUMS.txt
      - name: Verify checksum manifest payload equality
        shell: pwsh
        run: |
          $manifestNames = @(Get-Content release-assets/SHA256SUMS.txt | ForEach-Object {
            if ($_ -notmatch '^[0-9a-fA-F]{64}  (.+)$') { throw "invalid SHA256SUMS line: $_" }
            $Matches[1]
          })
          $payloadNames = @(Get-ChildItem release-assets -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object Name)
          $manifestComparison = Compare-Object ($manifestNames | Sort-Object) ($payloadNames | Sort-Object)
          if ($manifestComparison) { throw "SHA256SUMS payload set differs from staged payload set: $($manifestComparison | Out-String)" }
          if ($manifestNames.Count -ne 8 -or ($manifestNames | Select-Object -Unique).Count -ne 8) {
            throw "expected exactly eight unique checksum-bound payloads"
          }
      - name: Upload verified assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem "release-assets/*.whl")
          if ($wheel.Count -ne 1) { throw "expected exactly one release wheel" }
          $releaseAssets = @(
            $wheel[0].FullName,
            (Resolve-Path "release-assets/ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Setup.exe").Path,
            (Resolve-Path "release-assets/ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Green.zip").Path,
            (Resolve-Path "release-assets/ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Portable.zip").Path,
            (Resolve-Path "release-assets/release-identity.json").Path,
            (Resolve-Path "release-assets/release-manifest.json").Path,
            (Resolve-Path "release-assets/SBOM.cdx.json").Path,
            (Resolve-Path "release-assets/THIRD_PARTY_NOTICES.txt").Path,
            (Resolve-Path "release-assets/SHA256SUMS.txt").Path
          )
          gh release create $env:GITHUB_REF_NAME $releaseAssets --draft --verify-tag --title "ArcheAxis Knowledge $env:GITHUB_REF_NAME" --generate-notes
      - name: Read back and verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $expectedAssets = @(
            "ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Setup.exe",
            "ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Green.zip",
            "ArcheAxis.Knowledge-v${{ steps.resolve_version.outputs.release_version }}-Windows-x64-Portable.zip",
            "archeaxis_workspace-${{ steps.resolve_version.outputs.release_version }}-py3-none-any.whl",
            "release-identity.json",
            "release-manifest.json",
            "SBOM.cdx.json",
            "THIRD_PARTY_NOTICES.txt",
            "SHA256SUMS.txt"
          ) | Sort-Object
          $release = gh release view $env:GITHUB_REF_NAME --json tagName,targetCommitish,isDraft,assets,url | ConvertFrom-Json
          if ($release.tagName -ne $env:GITHUB_REF_NAME) { throw "release tag readback mismatch" }
          if ($release.isDraft -ne $true) { throw "release draft state mismatch" }
          $acceptedReleaseTargets = @("main", $env:GITHUB_SHA)
          if ($release.targetCommitish -notin $acceptedReleaseTargets) {
            throw "release target commit is neither main nor exact workflow SHA"
          }
          if ((git rev-list -n 1 "$($release.tagName)^{}").Trim() -ne $env:GITHUB_SHA) {
            throw "release tag target does not equal the exact workflow SHA"
          }
          $publicAssets = @($release.assets | ForEach-Object name | Sort-Object)
          if (Compare-Object $expectedAssets $publicAssets) {
            throw "public asset set differs from expected release asset set"
          }
          $downloadRoot = ".hermes/task-runtime/release-download-readback"
          New-Item -ItemType Directory -Force $downloadRoot | Out-Null
          gh release download $env:GITHUB_REF_NAME --dir $downloadRoot
          foreach ($asset in $release.assets) {
            if (-not $asset.digest -or -not $asset.digest.StartsWith("sha256:")) {
              throw "provider digest is missing for $($asset.name)"
            }
            $downloadedDigest = (Get-FileHash "$downloadRoot/$($asset.name)" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.digest.ToLowerInvariant() -ne "sha256:$downloadedDigest") {
              throw "provider digest differs from downloaded asset for $($asset.name)"
            }
          }
          $manifest = Get-Content "$downloadRoot/SHA256SUMS.txt" | ForEach-Object {
            if ($_ -notmatch '^([0-9a-fA-F]{64})  (.+)$') { throw "invalid downloaded SHA256SUMS line: $_" }
            [pscustomobject]@{ digest = $Matches[1].ToLowerInvariant(); name = $Matches[2] }
          }
          $expectedPayloads = @($expectedAssets | Where-Object { $_ -ne "SHA256SUMS.txt" } | Sort-Object)
          $manifestPayloads = @($manifest | ForEach-Object name | Sort-Object)
          if (Compare-Object $expectedPayloads $manifestPayloads) {
            throw "downloaded checksum payload set differs from expected payload set"
          }
          foreach ($entry in $manifest) {
            $actual = (Get-FileHash "$downloadRoot/$($entry.name)" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.digest) { throw "downloaded SHA-256 mismatch for $($entry.name)" }
            $asset = @($release.assets | Where-Object name -eq $entry.name)
            if ($asset.Count -ne 1 -or -not $asset[0].digest) { throw "missing provider digest for $($entry.name)" }
            if ($asset[0].digest.ToLowerInvariant() -ne "sha256:$actual") { throw "provider digest mismatch for $($entry.name)" }
          }
          $identity = Get-Content "$downloadRoot/release-identity.json" -Raw | ConvertFrom-Json
          if ($identity.schema_version -ne "3.0.0") {
            throw "release identity must be schema v3 (multi-artifact manifest with dependency locks)"
          }
          $tree = (git rev-parse "$env:GITHUB_SHA^{tree}").Trim()
          if ($identity.release.tag -ne $env:GITHUB_REF_NAME -or $identity.source.commit -ne $env:GITHUB_SHA) {
            throw "downloaded release identity does not bind tag and exact commit"
          }
          if ($identity.source.tree -ne $tree) {
            throw "downloaded release identity tree mismatch"
          }
          if (-not $identity.source.verification_ci_run_id -or -not $identity.source.verification_ci_url) {
            throw "downloaded release identity verification CI identity is missing"
          }
          if ($identity.source.verification_ci_run_id -eq $identity.source.release_run_id) {
            throw "verification CI run must differ from the release workflow run"
          }
          # v3: artifact manifest must cover exactly the public payload set
          $identityNames = @($identity.artifacts | ForEach-Object name | Sort-Object)
          if (Compare-Object $identityNames $expectedAssets) {
            throw "identity artifact manifest differs from public asset set"
          }
          $identityKinds = @($identity.artifacts | ForEach-Object kind | Sort-Object -Unique)
          foreach ($kind in @("installer", "green", "portable", "wheel", "sbom", "checksums", "identity", "manifest", "notices")) {
            if ($kind -notin $identityKinds) { throw "identity artifact manifest missing kind: $kind" }
          }
          # v3: dependency lock hashes must match the downloaded lock files
          foreach ($entry in $identity.dependency_locks.PSObject.Properties) {
            $actual = (Get-FileHash "$entry.Name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { throw "dependency lock hash mismatch for $($entry.Name)" }
          }
          $canonicalReleaseUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
          $canonicalReleaseRunUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ($identity.source.release_run_id -ne [int64]$env:GITHUB_RUN_ID -or $identity.source.release_run_url -ne $canonicalReleaseRunUrl -or $identity.release.url -ne $canonicalReleaseUrl) {
            throw "downloaded release identity provenance readback mismatch"
          }
      - name: Publish verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release edit $env:GITHUB_REF_NAME --draft=false
