name: Container Stack

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: requirements-ci.txt
      - name: Install quality dependencies
        run: uv pip install --system -r requirements-ci.txt
      - name: Run release quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests -q --tb=short
          python -m pytest knowledge_base/tests -q --tb=short
          python -m pytest integration-tests -q --tb=short
          python -m ruff check app shared knowledge_base inspiration_research Inspiration-Research shared-contracts/adapters app/workflow integration-tests scripts
          python scripts/check_architecture.py
          python scripts/check_repository_conventions.py --source head
          uv lock --check

  smoke:
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.verified_image.outputs.image_id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Generate ephemeral container environment
        shell: bash
        run: |
          set -euo pipefail
          api_key="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -hex 32)"
          while [ "$api_key" = "$jwt_secret" ]; do
            jwt_secret="$(openssl rand -hex 32)"
          done
          cat > .env.container <<EOF
          COGNITIVE_API_KEY=${api_key}
          COGNITIVE_JWT_SECRET=${jwt_secret}
          COGNITIVE_CORS_ORIGINS=http://127.0.0.1:8080
          COGNITIVE_CORS_METHODS=GET,POST,DELETE,OPTIONS
          COGNITIVE_CORS_HEADERS=Authorization,Content-Type,X-API-Key
          COGNITIVE_DOMAIN=localhost
          CADDY_TLS_EMAIL=ops@example.invalid
          COGNITIVE_IMAGE_TAG=ci
          CADDY_HTTP_PORT=8080
          CADDY_HTTPS_PORT=8443
          CADDY_INTERNAL_HTTP_PORT=8080
          CADDY_INTERNAL_HTTPS_PORT=8443
          EOF
          sed -i 's/^          //' .env.container
          chmod 600 .env.container

      - name: Build image
        run: docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml build --pull

      - name: Scan application runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: cognitive-loop-os:ci
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: 1

      - name: Scan Caddy runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: cognitive-caddy:ci
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: 1

      - name: Validate Compose config
        run: docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml config --quiet

      - name: Start real stack
        run: docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml up -d --wait migration core caddy

      - name: Reach governed core and internal research
        shell: bash
        run: |
          set -euo pipefail
          api_key="$(grep '^COGNITIVE_API_KEY=' .env.container | cut -d= -f2-)"
          curl --retry 60 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:8080/health >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/internal/research/health)" = "404"
          docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml exec -T core python - <<PY
          import os
          import urllib.request

          request = urllib.request.Request(
              "http://127.0.0.1:8000/internal/research/health",
              headers={"X-API-Key": os.environ["COGNITIVE_API_KEY"]},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              assert response.status == 200
          PY
          docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml exec -T core python - <<PY
          from inspiration_research.project_radar.collectors.github_trending import _load_registry_repos

          repos = _load_registry_repos()
          assert repos
          print(len(repos))
          PY

      - name: Prove non-root runtime and volume persistence
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml exec -T core id -u)" = "10001"
          caddy_container="$(docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml ps -q caddy)"
          test "$(docker inspect --format '{{.Config.User}}' "$caddy_container")" = "1000:1000"
          test "$(docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml exec -T caddy /usr/bin/caddy version)" = "v2.11.4"
          docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml exec -T core sh -c 'printf persisted > /app/data/container-persistence.txt'
          docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml restart core
          docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml up -d --wait core caddy
          docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml exec -T core sh -c 'test "$(cat /app/data/container-persistence.txt)" = "persisted"'

      - name: Exercise verified backup and offline restore activation
        shell: bash
        run: |
          set -euo pipefail
          api_key="$(grep '^COGNITIVE_API_KEY=' .env.container | cut -d= -f2-)"
          curl --retry 10 --retry-delay 1 --retry-all-errors -fsS \
            -H "X-API-Key: ${api_key}" \
            -H "Content-Type: application/json" \
            --data '{"title":"restore-before","content":"expected restored document","source":"ci"}' \
            http://127.0.0.1:8080/kb/documents >/dev/null
          docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml --profile ops run --rm integrity
          backup_path="$(docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml --profile ops run --rm backup | tail -n1)"
          test -n "$backup_path"
          curl --retry 10 --retry-delay 1 --retry-all-errors -fsS \
            -H "X-API-Key: ${api_key}" \
            -H "Content-Type: application/json" \
            --data '{"title":"restore-after","content":"must disappear after restore","source":"ci"}' \
            http://127.0.0.1:8080/kb/documents >/dev/null
          docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml stop caddy core
          candidate_path="$(docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml --profile ops run --rm -e COGNITIVE_RESTORE_BACKUP="$backup_path" restore-candidate | tail -n1)"
          test -n "$candidate_path"
          docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml --profile ops run --rm -e COGNITIVE_RESTORE_CANDIDATE="$candidate_path" restore-activate
          docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml up -d --wait core caddy
          curl --retry 60 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:8080/health >/dev/null
          restored="$(curl -fsS -H "X-API-Key: ${api_key}" 'http://127.0.0.1:8080/kb/documents?limit=50')"
          printf '%s' "$restored" | grep -q 'restore-before'
          if printf '%s' "$restored" | grep -q 'restore-after'; then
            printf '%s\n' "$restored"
            exit 1
          fi

      - name: Check no secrets or runtime artifacts are tracked
        shell: bash
        run: |
          set -euo pipefail
          tracked_bad="$(git ls-files | grep -E '(^\.env\.container$|\.sqlite($|-)|\.sqlite3($|-)|\.db($|-)|(^|/)dist/|(^|/)build/|\.whl$|\.egg-info/)' || true)"
          if [ -n "$tracked_bad" ]; then
            printf '%s\n' "$tracked_bad"
            exit 1
          fi
          git status --short

      - name: Capture verified image identity
        id: verified_image
        run: echo "image_id=$(docker image inspect --format '{{.Id}}' cognitive-loop-os:ci)" >> "$GITHUB_OUTPUT"

      - name: Tear down stack
        if: always()
        run: docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml --profile ops down -v --remove-orphans

  publish:
    runs-on: ubuntu-latest
    needs: [quality, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Generate publish build environment
        shell: bash
        run: |
          set -euo pipefail
          cat > .env.container <<EOF
          COGNITIVE_API_KEY=$(openssl rand -hex 32)
          COGNITIVE_JWT_SECRET=$(openssl rand -hex 32)
          COGNITIVE_CORS_ORIGINS=http://127.0.0.1:8080
          COGNITIVE_CORS_METHODS=GET,POST,DELETE,OPTIONS
          COGNITIVE_CORS_HEADERS=Authorization,Content-Type,X-API-Key
          COGNITIVE_DOMAIN=localhost
          CADDY_TLS_EMAIL=ops@example.invalid
          COGNITIVE_IMAGE_TAG=ci
          CADDY_HTTP_PORT=8080
          CADDY_HTTPS_PORT=8443
          CADDY_INTERNAL_HTTP_PORT=8080
          CADDY_INTERNAL_HTTPS_PORT=8443
          EOF
          chmod 600 .env.container

      - name: Build verified image source
        run: docker compose --env-file .env.container -f docker-compose.yml -f docker-compose.ci.yml build --pull

      - name: Match the smoke-tested image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' cognitive-loop-os:ci)" = "${{ needs.smoke.outputs.image_id }}"

      - name: Publish verified image to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag cognitive-loop-os:ci "$image:sha-${GITHUB_SHA}"
          docker tag cognitive-loop-os:ci "$image:latest"
          docker push "$image:sha-${GITHUB_SHA}"
          docker push "$image:latest"
