name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: requirements-ci.txt

      - name: Install minimal test dependencies
        run: uv pip install --system -r requirements-ci.txt

      - name: Install and verify local OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          tesseract --list-langs | grep --fixed-strings --line-regexp eng

      - name: Run OS-level tests
        run: python -m pytest tests/ -q --tb=short

      - name: Run KB tests
        working-directory: knowledge_base
        run: python -m pytest tests/ -q --tb=short

      - name: Run integration tests
        run: python -m pytest integration-tests/ -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: requirements-ci.txt

      - name: Install minimal lint dependencies
        run: uv pip install --system -r requirements-ci.txt

      - name: Validate repository naming and encoding conventions
        run: python scripts/check_repository_conventions.py --source head

      - name: Validate architecture boundaries
        run: python scripts/check_architecture.py

      - name: Run ruff
        run: python -m ruff check app shared knowledge_base inspiration_research Inspiration-Research shared-contracts/adapters app/workflow integration-tests scripts

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Build wheel from locked backend
        run: |
          uv export --frozen --only-group build --no-emit-project --format requirements-txt --output-file locked-build.txt
          python -m pip install --require-hashes -r locked-build.txt
          uv build --python "$(command -v python)" --wheel --no-build-isolation --out-dir dist
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "app/runtime_entrypoint.py",
              "app/research/github.py",
              "app/workspace/job_outbox.py",
              "shared/research_store.py",
              "shared/research_migration.py",
              "shared/media_extractor.py",
              "shared/migration_runner.py",
              "shared/runtime_guard.py",
              "shared/workspace_migration.py",
              "shared/core_schema.py",
              "inspiration_research/api.py",
          }
          def forbidden_member(name: str) -> bool:
              path = Path(name)
              return (
                  "tests" in path.parts
                  or any(part == "cache" or part.endswith("_cache") for part in path.parts)
                  or "__pycache__" in path.parts
                  or path.suffix.lower() in {".pyc", ".pyo", ".sqlite", ".sqlite3", ".db"}
                  or path.name == ".env"
                  or path.name.startswith(".env.")
              )

          synthetic_cache_members = {
              "app/.pytest_cache/v/cache/nodeids",
              "shared/.mypy_cache/3.11/cache.json",
              "app/cache/payload.bin",
          }
          assert all(forbidden_member(name) for name in synthetic_cache_members)
          missing = sorted(required - names)
          forbidden = sorted(name for name in names if forbidden_member(name))
          assert not missing, f"wheel missing Phase 4 modules: {missing}"
          assert not forbidden, f"wheel contains forbidden runtime artifacts: {forbidden}"
          PY
      - name: Install wheel with locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file locked-runtime.txt
          python -m pip install --require-hashes -r locked-runtime.txt
          python -m pip install --no-deps dist/*.whl
          python -m pip check
          python -m pip uninstall --yes setuptools wheel jaraco.context
          python -m pip uninstall --yes pip
          python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('pip', 'setuptools', 'wheel', 'jaraco'))"
      - name: Smoke-test installed runtime outside repository
        working-directory: ${{ runner.temp }}
        env:
          COGNITIVE_DATA_DIR: ${{ runner.temp }}/cognitive-runtime
        run: |
          python -m app.runtime_entrypoint migrate
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          import knowledge_base.cards.generator
          import knowledge_base.machine_knowledge.a_to_b
          import knowledge_base.search
          from app.main import app
          from fastapi.testclient import TestClient
          from knowledge_base.api import app as kb_app
          from shared.sleep_loop_engine import LOG_DIR

          assert not any(Path(path).name.lower() == "knowledge_base" for path in sys.path if path)
          with TestClient(kb_app) as kb:
              assert kb.get("/health").status_code == 200
              assert kb.get("/reviews/due").status_code == 200
              assert kb.get("/mistakes").status_code == 200
              assert kb.get("/a-to-b/candidates").status_code == 200
              assert kb.get("/machine-knowledge").status_code == 200
          with TestClient(app) as client:
              assert client.get("/health").status_code == 200
              assert client.get("/kb").status_code == 200
          runtime = Path(os.environ["COGNITIVE_DATA_DIR"])
          assert (runtime / "cognitive_os.sqlite").exists()
          assert LOG_DIR == runtime / "logs" / "sleep-loop"
          PY
          python - <<'PY'
          import app.research.github
          import shared.research_migration
          import shared.research_store
          from app.facades import (
              get_research_package,
              ingest_candidate,
              query_knowledge,
              research_github_repository,
          )
          from fastapi.testclient import TestClient
          from inspiration_research.api import app as ir_app
          from inspiration_research.contracts.generator import generate_contract
          from inspiration_research.intake.generator import generate_intake_card

          assert generate_intake_card("t", "w", ["x"]).intake_id.startswith("intake_")
          assert generate_contract("g", ["d"]).contract_id.startswith("contract_")
          routes = {route.path for route in ir_app.routes}
          assert {"/research/github-repository", "/research/packages/{package_id}"} <= routes
          with TestClient(ir_app) as client:
              assert client.get("/health").status_code == 200
          assert all(
              callable(item)
              for item in (
                  get_research_package,
                  ingest_candidate,
                  query_knowledge,
                  research_github_repository,
              )
          )
          PY
          python - <<'PY'
          import os
          import stat
          import tempfile
          from pathlib import Path

          import PIL
          import pytesseract
          from PIL import Image
          from shared.approved_paths import ApprovedRoots
          from shared.media_extractor import extract_image_text

          site_packages = "site-packages"
          assert site_packages in str(Path(PIL.__file__).resolve())
          assert site_packages in str(Path(pytesseract.__file__).resolve())
          root = Path(tempfile.mkdtemp())
          fake = root / "tesseract"
          fake.write_text("#!/bin/sh\nexit 0\n", encoding="utf-8")
          fake.chmod(fake.stat().st_mode | stat.S_IXUSR)
          os.environ["PATH"] = str(root) + os.pathsep + os.environ["PATH"]
          image = root / "evidence.png"
          Image.new("RGB", (8, 8), "white").save(image)
          pytesseract.image_to_string = lambda *_args, **_kwargs: "installed wheel OCR"
          result = extract_image_text(
              str(image), approved_roots=ApprovedRoots(source_roots=[root], output_roots=[root])
          )
          assert result["text"] == "installed wheel OCR"
          PY
          python - <<'PY'
          from pathlib import Path

          import app.workspace.job_outbox as job_outbox
          import shared.runtime_guard
          import shared.workspace_migration
          from app.main import app as application
          from fastapi.testclient import TestClient

          for module in (
              job_outbox,
              shared.runtime_guard,
              shared.workspace_migration,
          ):
              assert "site-packages" in str(Path(module.__file__).resolve())
          with TestClient(application) as client:
              created = client.post(
                  "/workspace/api/intake/upload",
                  files={"file": ("wheel.txt", b"installed wheel job readback", "text/plain")},
              )
              assert created.status_code == 200, created.text
              payload = created.json()
              loaded = client.get(f"/workspace/api/jobs/{payload['job_id']}")
              assert loaded.status_code == 200, loaded.text
              assert loaded.json()["package_id"] == payload["package_id"]
              assert loaded.json()["state"] == "succeeded"
          PY
          python -c "from app.contracts.v1 import TaskPackV1, TaskStepV1; from app.adapters.taskpack import from_knowledge_taskpack, project_to_runtime, to_knowledge_taskpack; from app.facades import contracts; from knowledge_base.taskpack import TaskPack; legacy=TaskPack(task_id='task_wheel', goal='wheel contract', steps=[{'step_id':'s1','action':'read','tool':'file_read'}], allowed_tools=['file_read','echo'], blocked_tools=['shell_exec']); canonical=from_knowledge_taskpack(legacy); projection=project_to_runtime(canonical); assert canonical.schema_version == '1.0.0'; assert isinstance(canonical.steps[0], TaskStepV1); assert canonical.requested_tools == ['file_read']; assert projection.task.tools == ['file_read']; assert to_knowledge_taskpack(canonical).to_dict() == legacy.to_dict(); assert TaskPackV1.model_json_schema()['\$id'].endswith('/contracts/v1/taskpack.schema.json'); assert contracts.TaskPackV1 is TaskPackV1"
          cognitive-os health
          cognitive-os stats
