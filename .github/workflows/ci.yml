name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gateplan:
    runs-on: ubuntu-latest
    outputs:
      required_gates: ${{ steps.gateplan.outputs.required_gates }}
      risk_classes: ${{ steps.gateplan.outputs.risk_classes }}
      full_qualification: ${{ steps.gateplan.outputs.full_qualification }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate deterministic GatePlan
        id: gateplan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
        run: |
          python -m pip install --quiet --user pyyaml
          python - <<'PY'
          import json, os, subprocess, sys
          from scripts.ci.classify import resolve_diff_refs

          base, head, refs_trusted = resolve_diff_refs(
              os.environ.get("EVENT_NAME", ""),
              push_before=os.environ.get("PUSH_BEFORE"),
              push_after=os.environ.get("PUSH_AFTER"),
              pull_base=os.environ.get("BASE_SHA"),
              pull_head=os.environ.get("HEAD_SHA"),
          )
          force_full = (os.environ.get("CI_FORCE_FULL") or "").lower() in ("1", "true", "yes")
          if not refs_trusted:
              print("WARNING: event diff refs are incomplete; forcing full qualification")
              force_full = True
          # Fail-closed: if we cannot compute a trustworthy diff we must run full
          # qualification, never silently skip heavy gates.
          try:
              out = subprocess.run(
                  ["git", "diff", "--name-only", base, head],
                  capture_output=True, text=True, check=True,
              ).stdout.splitlines()
              paths = [p for p in out if p.strip()]
              if not paths and base != head:
                  # Two-point diff empty but commits differ -> uncertain; force full.
                  print("WARNING: empty diff between different commits; forcing full")
                  force_full = True
          except subprocess.CalledProcessError as exc:
              print(f"WARNING: git diff failed ({exc}); forcing full qualification")
              paths = []
              force_full = True
          sys.path.insert(0, ".")
          from scripts.ci.classify import classify_paths
          plan = classify_paths(paths, force_full=force_full)
          plan["base_sha"] = base
          plan["head_sha"] = head
          plan["mode"] = "standalone"
          os.makedirs(".hermes/task-runtime", exist_ok=True)
          with open(".hermes/task-runtime/gateplan.json", "w", encoding="utf-8") as f:
              json.dump(plan, f, indent=2)
          # Emit required gates to downstream selective jobs.
          required = ",".join(plan["required_gates"])
          is_full = bool(plan.get("full_qualification"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"required_gates={required}\n")
              out.write(f"risk_classes={','.join(plan['matched_classes'])}\n")
              out.write(f"full_qualification={'true' if is_full else 'false'}\n")
          print(json.dumps(plan, indent=2))
          PY
          test -f .hermes/task-runtime/gateplan.json && echo "GatePlan written"

  test:
    runs-on: ubuntu-latest
    needs: gateplan
    if: ${{ needs.gateplan.result != 'success' || needs.gateplan.outputs.full_qualification == 'true' || contains(needs.gateplan.outputs.required_gates, 'py-primary') }}
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked minimal test dependencies
        run: |
          uv export --frozen --only-group ci --no-emit-project --format requirements-txt --output-file locked-ci.txt
          uv pip install --system --require-hashes -r locked-ci.txt

      - name: Install locked adapter test dependencies
        run: |
          uv export --frozen --only-group ci-adapters --no-emit-project --format requirements-txt --output-file locked-ci-adapters.txt
          uv pip install --system --require-hashes -r locked-ci-adapters.txt

      - name: Install and verify local OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          tesseract --list-langs | grep --fixed-strings --line-regexp eng

      - name: Run OS-level tests
        run: python -m pytest tests/ -q --tb=short

      - name: Run KB tests
        working-directory: knowledge_base
        run: python -m pytest tests/ -q --tb=short

      - name: Run integration tests
        run: python -m pytest integration-tests/ -q --tb=short

  py-compat:
    runs-on: ubuntu-latest
    needs: gateplan
    if: ${{ needs.gateplan.result != 'success' || needs.gateplan.outputs.full_qualification == 'true' || contains(needs.gateplan.outputs.required_gates, 'py-compat') }}
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked compatibility dependencies
        run: |
          uv export --frozen --only-group ci --no-emit-project --format requirements-txt --output-file locked-ci.txt
          uv pip install --system --require-hashes -r locked-ci.txt
      - name: Compile and import compatibility surface
        run: |
          python -m compileall -q app shared knowledge_base scripts
          python -m pytest tests/test_imported_modules.py -q --tb=short

  lint:
    runs-on: ubuntu-latest
    needs: gateplan
    if: ${{ needs.gateplan.result != 'success' || needs.gateplan.outputs.full_qualification == 'true' || contains(needs.gateplan.outputs.required_gates, 'lint') || contains(needs.gateplan.outputs.required_gates, 'static') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked minimal lint dependencies
        run: |
          uv export --frozen --only-group ci --no-emit-project --format requirements-txt --output-file locked-ci.txt
          uv pip install --system --require-hashes -r locked-ci.txt

      - name: Validate repository naming and encoding conventions
        run: python scripts/check_repository_conventions.py --source head

      - name: Validate architecture boundaries
        run: python scripts/check_architecture.py

      - name: Run ruff
        run: python -m ruff check app shared knowledge_base inspiration_research Inspiration-Research shared-contracts/adapters app/workflow integration-tests scripts

      - name: Validate Workspace JavaScript syntax
        run: node --check app/workspace/ui/assets/app.js

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: gateplan
    if: ${{ needs.gateplan.result != 'success' || needs.gateplan.outputs.full_qualification == 'true' || contains(needs.gateplan.outputs.required_gates, 'wheel-smoke') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Build wheel from locked backend
        run: |
          uv export --frozen --only-group build --no-emit-project --format requirements-txt --output-file locked-build.txt
          python -m pip install --require-hashes -r locked-build.txt
          uv build --python "$(command -v python)" --wheel --no-build-isolation --out-dir dist
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "app/release-manifest.json",
              "app/runtime_entrypoint.py",
              "app/research/github.py",
              "app/workspace/job_outbox.py",
              "app/workspace/ui/index.html",
              "app/workspace/ui/assets/styles.css",
              "app/workspace/ui/assets/app.js",
              "shared/research_store.py",
              "shared/research_migration.py",
              "shared/media_extractor.py",
              "shared/migration_runner.py",
              "shared/runtime_guard.py",
              "shared/workspace_migration.py",
              "shared/core_schema.py",
              "inspiration_research/api.py",
          }
          def forbidden_member(name: str) -> bool:
              path = Path(name)
              return (
                  "tests" in path.parts
                  or any(part == "cache" or part.endswith("_cache") for part in path.parts)
                  or "__pycache__" in path.parts
                  or path.suffix.lower() in {".pyc", ".pyo", ".sqlite", ".sqlite3", ".db"}
                  or path.name == ".env"
                  or path.name.startswith(".env.")
              )

          synthetic_cache_members = {
              "app/.pytest_cache/v/cache/nodeids",
              "shared/.mypy_cache/3.11/cache.json",
              "app/cache/payload.bin",
          }
          assert all(forbidden_member(name) for name in synthetic_cache_members)
          missing = sorted(required - names)
          forbidden = sorted(name for name in names if forbidden_member(name))
          assert not missing, f"wheel missing Phase 4 modules: {missing}"
          assert not forbidden, f"wheel contains forbidden runtime artifacts: {forbidden}"
          PY
      - name: Install wheel with locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file locked-runtime.txt
          python -m pip install --require-hashes -r locked-runtime.txt
          python -m pip install --no-deps dist/*.whl
          python -m pip check
          python -m pip uninstall --yes setuptools wheel jaraco.context
          python -m pip uninstall --yes pip
          python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('pip', 'setuptools', 'wheel', 'jaraco'))"
      - name: Smoke-test installed runtime outside repository
        working-directory: ${{ runner.temp }}
        env:
          COGNITIVE_DATA_DIR: ${{ runner.temp }}/cognitive-runtime
        run: |
          python -m app.runtime_entrypoint migrate
          python - <<'PY'
          import os
          import sys
          from importlib.metadata import version as installed_version
          from pathlib import Path

          import knowledge_base.cards.generator
          import knowledge_base.machine_knowledge.a_to_b
          import knowledge_base.search
          from app.main import app
          from app.release import load_release_manifest
          from fastapi.testclient import TestClient
          from knowledge_base.api import app as kb_app
          from shared.sleep_loop_engine import LOG_DIR

          assert not any(Path(path).name.lower() == "knowledge_base" for path in sys.path if path)
          assert installed_version("archeaxis-workspace") == load_release_manifest()["product"]["version"]
          with TestClient(kb_app) as kb:
              assert kb.get("/health").status_code == 200
              assert kb.get("/reviews/due").status_code == 200
              assert kb.get("/mistakes").status_code == 200
              assert kb.get("/a-to-b/candidates").status_code == 200
              assert kb.get("/machine-knowledge").status_code == 200
          with TestClient(app) as client:
              assert client.get("/health").status_code == 200
              assert client.get("/kb").status_code == 200
              assert client.get("/workspace").status_code == 200
              assert client.get("/workspace/api/status").status_code == 200
          runtime = Path(os.environ["COGNITIVE_DATA_DIR"])
          assert (runtime / "cognitive_os.sqlite").exists()
          assert LOG_DIR == runtime / "logs" / "sleep-loop"
          PY
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          runtime = Path(os.environ["COGNITIVE_DATA_DIR"])
          database = runtime / "cognitive_os.sqlite"
          connection = sqlite3.connect(database)
          checkpoint = connection.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone()
          assert checkpoint[0] == 0, checkpoint
          mode = connection.execute("PRAGMA journal_mode=DELETE").fetchone()[0]
          assert mode.casefold() == "delete", mode
          connection.close()
          sidecars = [database.with_name(database.name + suffix) for suffix in ("-wal", "-shm")]
          assert not [path for path in sidecars if path.exists()], sidecars
          PY
          COGNITIVE_DATA_DIR="${RUNNER_TEMP}/inspiration-runtime" python - <<'PY'
          import app.research.github
          import shared.research_migration
          import shared.research_store
          from app.facades import (
              get_research_package,
              ingest_candidate,
              query_knowledge,
              research_github_repository,
          )
          from fastapi.testclient import TestClient
          from inspiration_research.api import app as ir_app
          from inspiration_research.contracts.generator import generate_contract
          from inspiration_research.intake.generator import generate_intake_card

          assert generate_intake_card("t", "w", ["x"]).intake_id.startswith("intake_")
          assert generate_contract("g", ["d"]).contract_id.startswith("contract_")
          routes = {route.path for route in ir_app.routes}
          assert {"/research/github-repository", "/research/packages/{package_id}"} <= routes
          with TestClient(ir_app) as client:
              assert client.get("/health").status_code == 200
          assert all(
              callable(item)
              for item in (
                  get_research_package,
                  ingest_candidate,
                  query_knowledge,
                  research_github_repository,
              )
          )
          PY
          python - <<'PY'
          import os
          import stat
          import tempfile
          from pathlib import Path

          import PIL
          import pytesseract
          from PIL import Image
          from shared.approved_paths import ApprovedRoots
          from shared.media_extractor import extract_image_text

          site_packages = "site-packages"
          assert site_packages in str(Path(PIL.__file__).resolve())
          assert site_packages in str(Path(pytesseract.__file__).resolve())
          root = Path(tempfile.mkdtemp())
          fake = root / "tesseract"
          fake.write_text("#!/bin/sh\nexit 0\n", encoding="utf-8")
          fake.chmod(fake.stat().st_mode | stat.S_IXUSR)
          os.environ["PATH"] = str(root) + os.pathsep + os.environ["PATH"]
          image = root / "evidence.png"
          Image.new("RGB", (8, 8), "white").save(image)
          pytesseract.image_to_string = lambda *_args, **_kwargs: "installed wheel OCR"
          result = extract_image_text(
              str(image), approved_roots=ApprovedRoots(source_roots=[root], output_roots=[root])
          )
          assert result["text"] == "installed wheel OCR"
          PY
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          import app.workspace.job_outbox as job_outbox
          import shared.runtime_guard
          import shared.workspace_migration
          from app.main import app as application
          from fastapi.testclient import TestClient

          for module in (
              job_outbox,
              shared.runtime_guard,
              shared.workspace_migration,
          ):
              assert "site-packages" in str(Path(module.__file__).resolve())
          with TestClient(application) as client:
              created = client.post(
                  "/workspace/api/intake/upload",
                  files={"file": ("wheel.txt", b"installed wheel job readback", "text/plain")},
              )
              assert created.status_code == 200, created.text
              payload = created.json()
              assert not {"package_id", "job_id", "command_id", "event_id"} & payload.keys()
              database = Path(os.environ["COGNITIVE_DATA_DIR"]) / "cognitive_os.sqlite"
              with sqlite3.connect(database) as connection:
                  rows = connection.execute(
                      "SELECT job_id, aggregate_id FROM workspace_jobs_v1"
                  ).fetchall()
              assert len(rows) == 1, rows
              job_id, package_id = rows[0]
              loaded = client.get(f"/workspace/api/jobs/{job_id}")
              assert loaded.status_code == 200, loaded.text
              assert loaded.json()["package_id"] == package_id
              assert loaded.json()["state"] == "succeeded"
          PY
          python -c "from app.contracts.v1 import TaskPackV1, TaskStepV1; from app.adapters.taskpack import from_knowledge_taskpack, project_to_runtime, to_knowledge_taskpack; from app.facades import contracts; from knowledge_base.taskpack import TaskPack; legacy=TaskPack(task_id='task_wheel', goal='wheel contract', steps=[{'step_id':'s1','action':'read','tool':'file_read'}], allowed_tools=['file_read','echo'], blocked_tools=['shell_exec']); canonical=from_knowledge_taskpack(legacy); projection=project_to_runtime(canonical); assert canonical.schema_version == '1.0.0'; assert isinstance(canonical.steps[0], TaskStepV1); assert canonical.requested_tools == ['file_read']; assert projection.task.tools == ['file_read']; assert to_knowledge_taskpack(canonical).to_dict() == legacy.to_dict(); assert TaskPackV1.model_json_schema()['\$id'].endswith('/contracts/v1/taskpack.schema.json'); assert contracts.TaskPackV1 is TaskPackV1"
          archeaxis health
          archeaxis stats

  browser-smoke:
    runs-on: ubuntu-latest
    needs: gateplan
    if: ${{ needs.gateplan.result != 'success' || needs.gateplan.outputs.full_qualification == 'true' || contains(needs.gateplan.outputs.required_gates, 'browser-smoke') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked browser test dependencies
        run: |
          uv export --frozen --only-group ci --no-emit-project --format requirements-txt --output-file locked-ci.txt
          uv pip install --system --require-hashes -r locked-ci.txt
          uv export --frozen --only-group browser --no-emit-project --format requirements-txt --output-file locked-browser.txt
          uv pip install --system --require-hashes -r locked-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real Workspace browser regressions
        env:
          COGNITIVE_DATA_DIR: ${{ runner.temp }}/cognitive-browser-runtime
        run: python scripts/a0_browser_smoke.py

  windows-runtime-smoke:
    runs-on: windows-latest
    needs: gateplan
    if: ${{ needs.gateplan.result != 'success' || needs.gateplan.outputs.full_qualification == 'true' || contains(needs.gateplan.outputs.required_gates, 'windows-runtime') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked minimal runtime smoke dependencies
        run: |
          uv export --frozen --only-group ci --no-emit-project --format requirements-txt --output-file locked-ci.txt
          uv pip install --system --require-hashes -r locked-ci.txt
      - name: Migrate fresh Windows runtime
        env:
          COGNITIVE_DATA_DIR: ${{ runner.temp }}\cognitive-windows-runtime
        run: python -m app.runtime_entrypoint migrate
      - name: Run Windows Core and Workspace HTTP smoke
        env:
          COGNITIVE_DATA_DIR: ${{ runner.temp }}\cognitive-windows-runtime
        run: python scripts/runtime_http_smoke.py

  desktop-fast:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: gateplan
    if: ${{ needs.gateplan.result != 'success' || needs.gateplan.outputs.full_qualification == 'true' || contains(needs.gateplan.outputs.required_gates, 'desktop-fast') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Cache Rust registry, audit tool, and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-audit-0.22.2-naming-v2
          restore-keys: |
            ${{ runner.os }}-cargo-naming-v2-
      - name: Install locked Python runtime
        run: uv sync --frozen
      - name: Prepare the installed Python runtime
        run: >-
          python -m desktop.scripts.prepare_bundle
          --repository .
          --destination .hermes/desktop-runtime-v1
      - name: Test the Windows Rust library
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo test --lib
      - name: Test the development and installed backend lifecycles
        working-directory: desktop/src-tauri
        env:
          COGNITIVE_RATE_LIMIT_READ: "10000"
          COGNITIVE_RATE_LIMIT_WRITE: "1000"
          COGNITIVE_RATE_LIMIT_TOKEN: "100"
          COGNITIVE_RATE_LIMIT_ENABLED: "false"
        run: cargo test --test backend_lifecycle -- --ignored --nocapture

  desktop-build:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: gateplan
    if: ${{ needs.gateplan.result != 'success' || needs.gateplan.outputs.full_qualification == 'true' || contains(needs.gateplan.outputs.required_gates, 'desktop-build') || contains(needs.gateplan.outputs.required_gates, 'installer-lifecycle') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-build-naming-v2
          restore-keys: |
            ${{ runner.os }}-cargo-naming-v2-
      - name: Install locked Python runtime
        run: uv sync --frozen
      - name: Install locked desktop tooling
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the installed Python runtime
        run: >-
          python -m desktop.scripts.prepare_bundle
          --repository .
          --destination .hermes/desktop-runtime-v1
      - name: Audit locked Rust dependencies
        working-directory: desktop/src-tauri
        run: |
          $cargoBin = Join-Path $HOME ".cargo/bin"
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoAudit = Join-Path $cargoBin "cargo-audit.exe"
          if (-not (Test-Path $cargoAudit)) {
            cargo install cargo-audit --version 0.22.2 --locked
          }
          cargo audit --file Cargo.lock
      - name: Build the Windows release and NSIS installer
        working-directory: desktop
        run: |
          Remove-Item -LiteralPath "src-tauri/target/release/bundle/nsis" -Recurse -Force -ErrorAction SilentlyContinue
          npm run tauri -- build --bundles nsis
      - name: Require the Windows release artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop/src-tauri/target/release/archeaxis-desktop-shell.exe")) {
            throw "release executable is missing"
          }
          $package = Get-Content "desktop/package.json" -Raw | ConvertFrom-Json
          $installers = @(Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          $expected = "ArcheAxis OS_$($package.version)_x64-setup.exe"
          Write-Host "NSIS installers found: $($installers.Name -join ', ')"
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }
          if ($installers[0].Name -ne $expected) {
            throw "unexpected NSIS installer '$($installers[0].Name)', expected '$expected'"
          }
      - name: Upload the built installer for lifecycle verification
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          name: nsis-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  installer-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [gateplan, desktop-build]
    if: ${{ always() && needs.desktop-build.result == 'success' && (needs.gateplan.result != 'success' || needs.gateplan.outputs.full_qualification == 'true' || contains(needs.gateplan.outputs.required_gates, 'installer-lifecycle')) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Download the exact built installer
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
        with:
          name: nsis-installer
          path: desktop/src-tauri/target/release/bundle/nsis
      - name: Verify the installed NSIS lifecycle
        shell: pwsh
        env:
          COGNITIVE_RATE_LIMIT_READ: "10000"
          COGNITIVE_RATE_LIMIT_WRITE: "1000"
          COGNITIVE_RATE_LIMIT_TOKEN: "100"
          COGNITIVE_RATE_LIMIT_ENABLED: "false"
        run: |
          $package = Get-Content "desktop/package.json" -Raw | ConvertFrom-Json
          $installers = @(Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          $expected = "ArcheAxis OS_$($package.version)_x64-setup.exe"
          Write-Host "NSIS installers found: $($installers.Name -join ', ')"
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }
          if ($installers[0].Name -ne $expected) {
            throw "unexpected NSIS installer '$($installers[0].Name)', expected '$expected'"
          }
          ./desktop/scripts/verify_nsis_install.ps1 -Installer $installers[0].FullName

  a0-gates:
    if: ${{ always() }}
    needs: [gateplan, test, py-compat, lint, wheel-smoke, browser-smoke, windows-runtime-smoke, desktop-fast, desktop-build, installer-lifecycle]
    runs-on: ubuntu-latest
    steps:
      - name: Validate required gates against GatePlan (ci-verdict)
        env:
          REQUIRED_GATES: ${{ needs.gateplan.outputs.required_gates }}
          TEST_RESULT: ${{ needs.test.result }}
          COMPAT_RESULT: ${{ needs.py-compat.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          WHEEL_RESULT: ${{ needs.wheel-smoke.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
          WINDOWS_RESULT: ${{ needs.windows-runtime-smoke.result }}
          DESKTOP_FAST_RESULT: ${{ needs.desktop-fast.result }}
          DESKTOP_BUILD_RESULT: ${{ needs.desktop-build.result }}
          INSTALLER_RESULT: ${{ needs.installer-lifecycle.result }}
        run: |
          # GatePlan failed -> full qualification must run; fail closed.
          if [ "${{ needs.gateplan.result }}" != "success" ]; then
            echo "GatePlan failed; full qualification required"
            exit 1
          fi
          echo "Required gates: $REQUIRED_GATES"
          # required -> must be success
          require() {
            local name="$1" result="$2"
            if echo "$REQUIRED_GATES" | grep -qE "(^|,)$name(,|$)"; then
              if [ "$result" != "success" ]; then
                echo "REQUIRED gate '$name' is '$result' (must be success)"
                exit 1
              fi
            fi
          }
          # AXW-003A: gate on the GatePlan semantic IDs, not GitHub job names.
          # GatePlan emits `py-primary` for the OS/KB/integration suite (its
          # result arrives via the `test` job) and `static` for convention and
          # architecture checks (carried by the `lint` job). Requiring the bare
          # job name `test` would never match GatePlan and would let a required
          # py-primary failure pass as green.
          require py-primary "$TEST_RESULT"
          require static "$LINT_RESULT"
          require lint "$LINT_RESULT"
          require py-compat "$COMPAT_RESULT"
          require wheel-smoke "$WHEEL_RESULT"
          require browser-smoke "$BROWSER_RESULT"
          require windows-runtime "$WINDOWS_RESULT"
          require desktop-fast "$DESKTOP_FAST_RESULT"
          require desktop-build "$DESKTOP_BUILD_RESULT"
          require installer-lifecycle "$INSTALLER_RESULT"
          # A not-required job that RAN and failed is still a failure. Use the
          # job names (the only labels the `needs.*.result` are keyed by) but
          # check them against their real job results.
          for spec in "test:$TEST_RESULT" "py-compat:$COMPAT_RESULT" "lint:$LINT_RESULT" "wheel-smoke:$WHEEL_RESULT" "browser-smoke:$BROWSER_RESULT" "windows-runtime-smoke:$WINDOWS_RESULT" "desktop-fast:$DESKTOP_FAST_RESULT" "desktop-build:$DESKTOP_BUILD_RESULT" "installer-lifecycle:$INSTALLER_RESULT"; do
            name="${spec%%:*}"; result="${spec##*:}"
            if [ "$result" = "failure" ]; then
              echo "job '$name' failed even though its gate was not required"
              exit 1
            fi
          done
          echo "ci-verdict: all required gates success"
