name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run OS-level tests
        run: python -m pytest tests/ -q --tb=short

      - name: Run KB tests
        working-directory: knowledge_base
        run: python -m pytest tests/ -q --tb=short

      - name: Run integration tests
        run: python -m pytest integration-tests/ -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate repository naming and encoding conventions
        run: python scripts/check_repository_conventions.py --source head

      - name: Validate architecture boundaries
        run: python scripts/check_architecture.py

      - name: Run ruff
        run: python -m ruff check app shared knowledge_base inspiration_research Inspiration-Research shared-contracts/adapters app/workflow integration-tests scripts

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel with runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps dist/*.whl
      - name: Smoke-test installed runtime outside repository
        working-directory: ${{ runner.temp }}
        env:
          COGNITIVE_DATA_DIR: ${{ runner.temp }}/cognitive-runtime
        run: |
          python -c "from pathlib import Path; import os, sys; assert not any(Path(p).name.lower() == 'knowledge_base' for p in sys.path if p); import knowledge_base.cards.generator, knowledge_base.machine_knowledge.a_to_b, knowledge_base.search; from knowledge_base.api import app as kb_app; from fastapi.testclient import TestClient; kb=TestClient(kb_app); assert kb.get('/health').status_code == 200; assert kb.get('/reviews/due').status_code == 200; assert kb.get('/mistakes').status_code == 200; assert kb.get('/a-to-b/candidates').status_code == 200; assert kb.get('/machine-knowledge').status_code == 200; assert not any(Path(p).name.lower() == 'knowledge_base' for p in sys.path if p); from app.main import app; from shared.sleep_loop_engine import LOG_DIR; c=TestClient(app); assert c.get('/health').status_code == 200; assert c.get('/kb').status_code == 200; runtime=Path(os.environ['COGNITIVE_DATA_DIR']); assert (runtime/'cognitive_os.sqlite').exists(); assert LOG_DIR == runtime/'logs'/'sleep-loop'"
          python -c "from inspiration_research.intake.generator import generate_intake_card; from inspiration_research.contracts.generator import generate_contract; from inspiration_research.api import app as ir_app; from app.facades import ingest_candidate, query_knowledge; from fastapi.testclient import TestClient; assert generate_intake_card('t','w',['x']).intake_id.startswith('intake_'); assert generate_contract('g',['d']).contract_id.startswith('contract_'); assert TestClient(ir_app).get('/health').status_code == 200; assert callable(ingest_candidate) and callable(query_knowledge)"
          python -c "from app.contracts.v1 import TaskPackV1, TaskStepV1; from app.adapters.taskpack import from_knowledge_taskpack, project_to_runtime, to_knowledge_taskpack; from app.facades import contracts; from knowledge_base.taskpack import TaskPack; legacy=TaskPack(task_id='task_wheel', goal='wheel contract', steps=[{'step_id':'s1','action':'read','tool':'file_read'}], allowed_tools=['file_read','echo'], blocked_tools=['shell_exec']); canonical=from_knowledge_taskpack(legacy); projection=project_to_runtime(canonical); assert canonical.schema_version == '1.0.0'; assert isinstance(canonical.steps[0], TaskStepV1); assert canonical.requested_tools == ['file_read']; assert projection.task.tools == ['file_read']; assert to_knowledge_taskpack(canonical).to_dict() == legacy.to_dict(); assert TaskPackV1.model_json_schema()['\$id'].endswith('/contracts/v1/taskpack.schema.json'); assert contracts.TaskPackV1 is TaskPackV1"
          cognitive-os health
          cognitive-os stats
