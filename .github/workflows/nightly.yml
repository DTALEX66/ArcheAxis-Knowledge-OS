name: nightly

# AXC-080: nightly tier — compatibility matrix + long corpus + browser/
# windows runtime. Runs on schedule or manual dispatch; NOT on every push.
# Fast path stays in ci.yml (gateplan-driven, minutes). Release stays in
# release.yml (exact-SHA artifacts).

on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC daily, off-peak runner queue
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to qualify"
        required: false
        default: "main"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  py-compat:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked compatibility dependencies
        run: |
          uv export --frozen --only-group ci --no-emit-project --format requirements-txt --output-file locked-ci.txt
          uv pip install --system --require-hashes -r locked-ci.txt
      - name: Compile and import compatibility surface
        run: |
          python -m compileall -q app shared knowledge_base scripts
          python -m pytest tests/test_imported_modules.py -q --tb=short

  full-suite:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install ci + ci-adapters groups
        run: |
          uv sync --frozen --group ci --group ci-adapters
      - name: Install and verify local OCR engine
        # Mirrors ci.yml OS-level tests: full-suite runs every test,
        # including real-tesseract media tests that fail without the engine.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          tesseract --list-langs | grep --fixed-strings --line-regexp eng
      - name: Full Python suite
        # Explicit dirs: testpaths in pyproject covers tests/ + KB but NOT
        # integration-tests/ (35 tests) — ci.yml runs them as a separate
        # step; nightly's full-matrix job must mirror all three.
        run: |
          env -u PYTHONPATH uv run --frozen --group ci --group ci-adapters pytest -q --tb=short tests/ integration-tests/ knowledge_base/tests/

  browser-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: full-suite
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install ci + ci-adapters + browser groups
        # All three groups into the venv so the smoke script's spawned
        # `sys.executable -m app.runtime_entrypoint migrate` runs against the
        # same interpreter that has the project deps (ci.yml's gate uses
        # pip --system instead; venv is more consistent for the nightly tier).
        run: |
          uv sync --frozen --group ci --group ci-adapters --group browser
      - name: Install Chromium
        run: uv run --frozen --group browser python -m playwright install --with-deps chromium
      - name: Install locked canonical frontend tooling
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Workspace API suite
        run: |
          env -u PYTHONPATH uv run --frozen --group ci --group ci-adapters pytest tests/test_workspace_api.py -q --tb=short
      - name: Real Workspace browser regressions
        env:
          ARCHEAXIS_DATA_DIR: ${{ runner.temp }}/cognitive-browser-runtime
        run: |
          env -u PYTHONPATH uv run --frozen --group ci --group ci-adapters --group browser python scripts/a0_browser_smoke.py

  windows-runtime:
    timeout-minutes: 15
    runs-on: windows-latest
    needs: full-suite
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install ci + ci-adapters
        run: |
          uv sync --frozen --group ci --group ci-adapters
      - name: Windows runtime tests
        shell: pwsh
        run: |
          Remove-Item -LiteralPath Env:PYTHONPATH -ErrorAction SilentlyContinue
          uv run --frozen --group ci --group ci-adapters pytest tests/test_desktop_runtime.py tests/test_migration_runner.py -q --tb=short
      - name: Migrate fresh Windows runtime
        env:
          ARCHEAXIS_DATA_DIR: ${{ runner.temp }}\cognitive-windows-runtime
        run: uv run --frozen --group ci --group ci-adapters python -m app.runtime_entrypoint migrate
      - name: Run Windows Core and Workspace HTTP smoke
        env:
          ARCHEAXIS_DATA_DIR: ${{ runner.temp }}\cognitive-windows-runtime
        run: uv run --frozen --group ci --group ci-adapters python scripts/runtime_http_smoke.py
