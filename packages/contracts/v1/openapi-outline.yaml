openapi: 3.1.0
info:
  title: ArcheAxis Local Service
  version: 0.2.0-reference-slice2
  description: >
    Reference contract for the vNext loopback API (T02 slice2 freeze).
    Path/verb inventory below is the agreed surface for the closed loop;
    it remains a reference until each route actually carries it (route
    conformance is tracked in the T03/T04/T12 lanes, not claimed here).
    Error semantics: errors.catalog.yaml codes map to HTTP statuses; every
    failure body is {code, message, retryable} (component Error).
    Status vocabulary: job-status.schema.json; review/evidence states:
    assessment-vocabulary.schema.json; anchors: anchor-coordinate.schema.json.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
security:
  - launchToken: []
x-freeze:
  schema: archeaxis.openapi-reference/v1
  slice: t02-slice2
  date: 2026-09-05
  status: reference-not-implementation
paths:
  # AAOS-01 current-source slice; the older reference-only paths retain their status.
  /api/v1/sources:
    get:
      operationId: listCanonicalSources
      description: "Immutable source revision metadata."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "200":
          description: Canonical response
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/SourcesListDto"
  /api/v1/sources/{source_id}/original:
    parameters:
      - name: source_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: readCanonicalOriginal
      description: "Original bytes in bounded content_base64 with SHA; never a caller filesystem path."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "200":
          description: Canonical response
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/OriginalDto"
        "404": {description: Referenced source/document/version not found}
  /api/v1/documents:
    get:
      operationId: listCanonicalDocuments
      description: "Metadata summaries only; read one document for full editor JSON."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "200":
          description: Canonical response
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/DocumentsListDto"
    post:
      operationId: createCanonicalDocument
      description: "Human only; body source_id, source_revision, title, editor_json. Unknown fields rejected; source revision must exist."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "201":
          description: Canonical response
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/DocumentDto"
        "403": {description: Machine actor cannot mutate this resource}
        "404": {description: Referenced source/document/version not found}
  /api/v1/documents/{document_id}:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: readCanonicalDocument
      description: "Current editor JSON, stable block IDs and text projection in one persisted version."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "200":
          description: Canonical response
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/DocumentDto"
        "404": {description: Referenced source/document/version not found}
  /api/v1/documents/{document_id}/draft:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: {type: string}
    put:
      operationId: saveCanonicalDocument
      description: "Human only; body expected_version, editor_json. Unknown fields rejected; stale version returns 409 without overwrite."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "200":
          description: Canonical response
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/DocumentDto"
        "403": {description: Machine actor cannot mutate this resource}
        "409": {description: Stale version or conflicting canonical identity}
        "404": {description: Referenced source/document/version not found}
  /api/v1/documents/{document_id}/versions/{version}:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: {type: string}
      - name: version
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    get:
      operationId: readCanonicalDocumentVersion
      description: "Immutable historical document version."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "200":
          description: Canonical response
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/DocumentDto"
        "404": {description: Referenced source/document/version not found}
  /api/v1/documents/{document_id}/restore:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: restoreCanonicalDocumentVersion
      description: "Human only; body expected_version, restore_version. Unknown fields rejected; stale version 409; restore creates a new version."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "200":
          description: Canonical response
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/DocumentDto"
        "403": {description: Machine actor cannot mutate this resource}
        "409": {description: Stale version or conflicting canonical identity}
        "404": {description: Referenced source/document/version not found}
  /api/v1/documents/{document_id}/export:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: exportCanonicalDocument
      description: "Query format=markdown or obsidian; unknown query fields rejected. Text projection and manifest preserve structured content with explicit loss; external app acceptance is separate."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "200":
          description: Canonical response
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/DocumentExportDto"
        "404": {description: Referenced source/document/version not found}
  /api/v1/knowledge/{id}/review/versioned:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: reviewCanonicalKnowledgeVersioned
      description: "Human only; body action, reviewer, expected_version, optional note/new_body. Stale expected_version returns 409 with current_version. No automatic human approval."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "200":
          description: Knowledge id and new version
        "403": {description: Machine actor cannot mutate this resource}
        "409": {description: Stale version or conflicting canonical identity}
        "404": {description: Referenced source/document/version not found}
  /api/v1/workspace/backups:
    get:
      operationId: listCanonicalBackups
      description: "Product-owned artifacts with hashes, schema and SQLite versions; no caller path."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "200":
          description: Canonical response
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/BackupsListDto"
    post:
      operationId: createCanonicalBackup
      description: "Human only; no caller path. Creates a consistent artifact; independent restore remains a separate verification."
      x-contract-status: implemented-source-slice-not-owner-acceptance
      responses:
        "201":
          description: Canonical response
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/BackupDto"
        "403": {description: Machine actor cannot mutate this resource}
  /api/v1/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getJobExecutionStatus
      responses:
        "200": {description: "Persisted job_id, state, attempt, request_id, error"}
        "404": {description: Unknown job}
        "503": {description: Runtime or terminal storage unavailable}
  /api/v1/jobs/{job_id}/executions:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: startTextExecution
      description: Requires explicit text_worker launch profile. 202 follows durable claim, not completion. Same workspace-wide key/job/deadline replays; different payload conflicts. Two active worker slots; no automatic retry.
      parameters:
        - name: idempotency-key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,200}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deadline_ms]
              properties:
                deadline_ms: {type: integer, minimum: 1, maximum: 300000}
      responses:
        "202": {description: "Accepted/replayed job_id, request_id, state, replayed"}
        "409": {description: Identity conflict or disallowed state}
        "422": {description: Invalid execution identity or request}
        "503": {description: Capacity exhausted or runtime unavailable}
  /api/v1/jobs/{job_id}/executions/{request_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: request_id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: cancelTextExecution
      description: Signal only the named attempt. Poll status; a committed success cannot be undone.
      responses:
        "202": {description: Cancellation signal accepted}
        "200": {description: Already terminal; no mutation}
        "404": {description: Unknown attempt}
        "409": {description: Stale attempt identity}
        "503": {description: Runtime unavailable}
  /api/v1/jobs/{job_id}/outputs/{kind}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: kind
        in: path
        required: true
        schema: {type: string, enum: [text, document_structure, loss_report]}
    get:
      operationId: getTextExecutionOutput
      responses:
        "200": {description: Persisted metadata and UTF-8 content from latest verified attempt}
        "404": {description: No such verified output}
  /api/v1/system/version:
    get:
      operationId: getVersion
      responses:
        "200":
          description: Runtime and contract versions
  /api/v1/workspaces:
    post:
      operationId: createWorkspace
      responses:
        "201":
          description: Workspace created
  /api/v1/imports:
    post:
      operationId: importSource
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file: {type: string, format: binary}
                metadata: {type: object}
      responses:
        "202":
          description: Import job accepted
  /api/v1/sources/{source_id}/anchors:
    get:
      operationId: readCanonicalSourceAnchors
      description: Current-source slice; located, unverified and revision_mismatch are distinct. No new Owner acceptance is claimed.
      parameters:
        - name: source_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Canonical anchors for this source revision
          content:
            application/json:
              schema:
                $ref: "core-document.schema.json#/$defs/AnchorsListDto"
    post:
      operationId: createAnchor
      description: "Body revision, position, checksum?; UTF-8 text positions use byte offsets and the selected slice checksum. Revision binding alone is not verified location."
      parameters:
        - name: source_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Anchor created
  /api/v1/knowledge-items:
    post:
      operationId: createKnowledge
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Personal knowledge created
  /api/v1/candidate-extractions:
    post:
      operationId: requestCandidate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Candidate job accepted
  /api/v1/knowledge-items/{knowledge_item_id}/review-decisions:
    post:
      operationId: recordReview
      parameters:
        - name: knowledge_item_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "201":
          description: Immutable review recorded
  /api/v1/search:
    post:
      operationId: search
      responses:
        "200":
          description: Search hits with anchor jump targets
  /api/v1/learning-items/{learning_item_id}/events:
    post:
      operationId: recordLearningEvent
      parameters:
        - name: learning_item_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "201":
          description: Learning event recorded
  /api/v1/learning/items:
    get:
      operationId: listLearningItems
      responses:
        "200":
          description: Read-only learning queue projection with latest review deadlines
  /api/v1/exports:
    post:
      operationId: createExport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Export job accepted
  /api/v1/restore-validations:
    post:
      operationId: validateRestore
      responses:
        "200":
          description: Restore package validation receipt
components:
  securitySchemes:
    launchToken:
      type: apiKey
      in: header
      name: x-archeaxis-launch-token
      description: Ephemeral per-process desktop credential sent through the inherited stdin pipe at launch; never in argv or readiness output. Native desktop only; browser Origin requests are denied. Requested scopes cannot grant authority.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
      description: Failure envelope on every channel (errors.catalog.yaml codes).
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,200}$'}
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Bounded write idempotency key (protocol-mapping.md); replay-safe, payload conflicts rejected with AAK-CON-002.
    ScopeHeader:
      name: x-archeaxis-scopes
      in: header
      required: false
      schema:
        type: string
      description: Requested scopes (e.g. workspace:write) for gated writes.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"r[0-9]+"$'
