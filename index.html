<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HERMES 就寝无人值守循环面板</title>
  <style>
    :root { --bg:#0d0714; --panel:#171020; --panel2:#21162f; --text:#f3eaff; --muted:#a89ab8; --accent:#a970ff; --ok:#49d17d; --bad:#ff5c7a; --warn:#ffd166; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; background: radial-gradient(circle at top left,#2b1744 0,#0d0714 36%,#08050d 100%); color:var(--text); }
    header { padding:24px; border-bottom:1px solid #30223e; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    h1 { margin:0; font-size:22px; letter-spacing:.04em; }
    main { padding:20px; display:grid; grid-template-columns: 380px 1fr; gap:18px; }
    .card { background:linear-gradient(180deg,var(--panel),#110b19); border:1px solid #352348; border-radius:18px; padding:16px; box-shadow:0 12px 40px rgba(0,0,0,.28); }
    .grid { display:grid; grid-template-columns: repeat(4,minmax(120px,1fr)); gap:12px; }
    .metric { background:var(--panel2); border:1px solid #3d2954; border-radius:14px; padding:14px; }
    .metric b { display:block; font-size:26px; color:var(--accent); margin-top:8px; }
    label { display:block; margin:10px 0 5px; color:var(--muted); font-size:13px; }
    input, textarea { width:100%; background:#0b0711; color:var(--text); border:1px solid #423055; border-radius:10px; padding:10px; outline:none; }
    textarea { min-height:120px; resize:vertical; }
    button { border:0; border-radius:12px; padding:10px 14px; color:white; background:var(--accent); cursor:pointer; margin:6px 6px 6px 0; font-weight:700; }
    button.secondary { background:#3a2b4d; }
    button.danger { background:var(--bad); }
    button.warn { background:#7c5b14; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { border-bottom:1px solid #2c2039; padding:8px; text-align:left; vertical-align:top; }
    th { color:#d6c5ef; }
    .pill { display:inline-block; border-radius:999px; padding:3px 8px; background:#312243; color:#d8c3ff; font-size:12px; }
    .ok { color:var(--ok); } .bad { color:var(--bad); } .warnText { color:var(--warn); }
    pre { white-space:pre-wrap; background:#09060d; border-radius:12px; padding:12px; max-height:280px; overflow:auto; border:1px solid #2f2140; }
    @media (max-width: 900px) { main { grid-template-columns:1fr; } .grid { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
<header>
  <h1>🌙 HERMES 就寝无人值守循环面板</h1>
  <div><span class="pill" id="apiState">未连接</span></div>
</header>
<main>
  <section class="card">
    <h2>控制</h2>
    <label>API 地址</label>
    <input id="apiBase" value="http://127.0.0.1:8000" />
    <label>本地 API Key（仅保存在浏览器 localStorage）</label>
    <input id="apiKey" placeholder="输入你的本地 API Key" />
    <label>主任务 / 夜间任务池</label>
    <textarea id="goal">整理当前项目状态；运行安全的本地检查；生成次日复盘日志</textarea>
    <label>参数</label>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <input id="maxSplit" type="number" value="20" title="单次拆解上限" />
      <input id="cycleSleep" type="number" value="30" title="轮间休眠秒" />
      <input id="maxRetries" type="number" value="3" title="失败重试" />
      <input id="maxParallel" type="number" value="4" title="并发上限" />
    </div>
    <button onclick="startLoop()">开启就寝模式</button>
    <button class="secondary" onclick="postAction('pause', {reason:'panel_pause'})">暂停</button>
    <button class="secondary" onclick="postAction('resume', {})">恢复</button>
    <button class="warn" onclick="postAction('tick', {})">手动 Tick</button>
    <button class="danger" onclick="postAction('stop', {reason:'panel_stop'})">终止就寝模式</button>
    <p style="color:var(--muted);font-size:13px">静默策略：不弹窗、不语音、不外发通知；严重问题只写本地告警日志。</p>
  </section>

  <section class="card">
    <h2>实时状态</h2>
    <div class="grid">
      <div class="metric">状态<b id="status">-</b></div>
      <div class="metric">轮次<b id="cycle">0</b></div>
      <div class="metric">待执行<b id="pending">0</b></div>
      <div class="metric">运行秒数<b id="runtime">0</b></div>
    </div>
    <h3>队列</h3>
    <table><thead><tr><th>状态</th><th>标题</th><th>重试</th><th>错误</th></tr></thead><tbody id="tasks"></tbody></table>
    <h3>日志</h3>
    <pre id="logs"></pre>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
$('apiKey').value = localStorage.getItem('sleepLoopApiKey') || '';
$('apiBase').value = localStorage.getItem('sleepLoopApiBase') || $('apiBase').value;
function headers() {
  localStorage.setItem('sleepLoopApiKey', $('apiKey').value);
  localStorage.setItem('sleepLoopApiBase', $('apiBase').value);
  return {'Content-Type':'application/json','X-API-Key':$('apiKey').value};
}
async function getAction(action) {
  const res = await fetch(`${$('apiBase').value}/sleep-loop?action=${action}`, {headers: headers()});
  if (!res.ok) throw new Error(await res.text());
  return await res.json();
}
async function postAction(action, body) {
  const res = await fetch(`${$('apiBase').value}/sleep-loop?action=${action}`, {method:'POST', headers: headers(), body: JSON.stringify(body || {})});
  if (!res.ok) throw new Error(await res.text());
  await refresh();
  return await res.json();
}
async function startLoop() {
  await postAction('start', {
    goal: $('goal').value,
    config: {
      max_split_tasks: Number($('maxSplit').value),
      cycle_sleep_seconds: Number($('cycleSleep').value),
      max_retries: Number($('maxRetries').value),
      max_parallel_tasks: Number($('maxParallel').value),
      quiet_mode: true
    }
  });
}
function esc(s) { return String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
async function refresh() {
  try {
    const st = await getAction('status');
    $('apiState').textContent = '已连接'; $('apiState').className = 'pill ok';
    $('status').textContent = st.status || '-';
    $('cycle').textContent = st.cycle_no || 0;
    $('pending').textContent = st.queue?.pending || 0;
    $('runtime').textContent = st.runtime_seconds || 0;
    const tasks = await getAction('tasks');
    const tbody = $('tasks');
    tbody.replaceChildren(...(tasks.items || []).slice(0, 30).map(t => {
      const tr = document.createElement('tr');
      [t.status, t.title, `${t.retries}/${t.max_retries}`, t.error].forEach(value => {
        const td = document.createElement('td');
        td.textContent = value ?? '';
        tr.appendChild(td);
      });
      return tr;
    }));
    const logs = await getAction('logs');
    $('logs').textContent = (logs.items || []).slice(0, 40).map(e => `[${e.created_at}] ${e.level}/${e.event_type}: ${e.message}`).join('\n');
  } catch (err) {
    $('apiState').textContent = '连接失败'; $('apiState').className = 'pill bad';
    $('logs').textContent = String(err);
  }
}
setInterval(refresh, 3000);
refresh();
</script>
</body>
</html>
