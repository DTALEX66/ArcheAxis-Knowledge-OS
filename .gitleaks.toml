# Secret scanning for this repository (gitleaks v8.30.1, MIT).
#
# The default ruleset is kept on: this file only removes known-good findings, so a
# genuinely new secret is still reported. The allowlist is deliberately narrow - it
# names the exact fake values used by the fallback/gateway/hardening tests rather
# than whole files, so a real credential added to those files would still fail.
title = "ArcheAxis Knowledge secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "deliberately fake credentials in the test fixtures"
regexTarget = "match"
regexes = [
  '''sk-1234567890abcdef1234567890abcdef''',
  '''test-api-key-0123456789abcdef-ABCDEFGH''',
  '''test-jwt-secret-fedcba9876543210-HGFEDCBA''',
  '''-----BEGIN RSA PRIVATE KEY-----''',
  '''eyJhbGciOiJIUzI1NiJ9''',
]

[[allowlists]]
description = "build output, dependency and development trees are not source"
paths = [
  '''\.project-local/''',
  '''node_modules/''',
  '''__pycache__/''',
  '''\.venv/''',
  '''target/''',
]
