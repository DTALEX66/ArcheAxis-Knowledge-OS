<svg xmlns="http://www.w3.org/2000/svg" class="aurora" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">ArcheAxis AA</title>
  <desc id="desc">B10 brand tile: a 48 by 48 rounded teal gradient square with a centered bold white AA monogram.</desc>
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37CAC7" />
      <stop offset="1" stop-color="#90C291" />
    </linearGradient>
    <linearGradient id="monochrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2E5E7" />
      <stop offset="1" stop-color="#ADB4B8" />
    </linearGradient>
    <radialGradient id="aurora-highlight" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28" />
      <stop offset="1" stop-color="#1FC8C5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="monochrome-highlight" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".24" />
      <stop offset="1" stop-color="#E2E5E7" stop-opacity="0" />
    </radialGradient>
    <filter id="aurora-glow" x="-70%" y="-70%" width="240%" height="280%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1FC8C5" flood-opacity=".38" />
    </filter>
    <filter id="monochrome-glow" x="-70%" y="-70%" width="240%" height="280%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#E1E4E6" flood-opacity=".30" />
    </filter>
  </defs>
  <style>
    .aurora .brand-tile { fill: url(#aurora); filter: url(#aurora-glow); }
    .monochrome .brand-tile { fill: url(#monochrome); filter: url(#monochrome-glow); }
    .aurora .brand-highlight { fill: url(#aurora-highlight); }
    .monochrome .brand-highlight { fill: url(#monochrome-highlight); }
  </style>
  <rect class="brand-tile" x="0.5" y="0.5" width="47" height="47" rx="16" />
  <rect class="brand-highlight" x="0.5" y="0.5" width="47" height="47" rx="16" />
  <text x="24" y="29" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing=".64">AA</text>
</svg>