# Cognitive-Loop-OS v0.4.0 — unified Docker Compose
# Start: docker compose up -d
# Access:
#   Cognitive-OS (core):    http://localhost:8000/docs
#   Knowledge-Base:         http://localhost:8000/kb/docs (mounted, not separately exposed)
#   Dashboard:              http://localhost:8000/kb
#   Inspiration-Research:   http://localhost:8001/docs

version: "3.9"

services:
  cognitive-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognitive-os
    ports:
      - "8000:8000"
    environment:
      - COGNITIVE_ENV=production
      - COGNITIVE_AUTH_ENABLED=true
      - COGNITIVE_API_KEY=${COGNITIVE_API_KEY:?Set COGNITIVE_API_KEY}
      - COGNITIVE_JWT_SECRET=${COGNITIVE_JWT_SECRET:?Set COGNITIVE_JWT_SECRET}
      - COGNITIVE_CORS_ORIGINS=${COGNITIVE_CORS_ORIGINS:?Set COGNITIVE_CORS_ORIGINS}
      - COGNITIVE_DATA_DIR=/app/data
    volumes:
      - cognitive-data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000

  inspiration-research:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspiration-research
    ports:
      - "8001:8001"
    environment:
      - COGNITIVE_ENV=production
      - COGNITIVE_AUTH_ENABLED=true
      - COGNITIVE_API_KEY=${COGNITIVE_API_KEY:?Set COGNITIVE_API_KEY}
      - COGNITIVE_JWT_SECRET=${COGNITIVE_JWT_SECRET:?Set COGNITIVE_JWT_SECRET}
      - COGNITIVE_CORS_ORIGINS=${COGNITIVE_CORS_ORIGINS:?Set COGNITIVE_CORS_ORIGINS}
      - COGNITIVE_DATA_DIR=/app/data
    volumes:
      - cognitive-data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped
    depends_on:
      cognitive-os:
        condition: service_healthy
    command: >
      uvicorn Inspiration-Research.api:app --host 0.0.0.0 --port 8001

volumes:
  cognitive-data:
