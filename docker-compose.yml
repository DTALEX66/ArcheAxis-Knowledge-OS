name: cognitive-loop-os

x-app-image: &app-image
  image: cognitive-loop-os:${COGNITIVE_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SOURCE_DATE_EPOCH: "315532800"

x-storage-environment: &storage-environment
  COGNITIVE_DATA_DIR: /app/data
  COGNITIVE_DB_PATH: /app/data/cognitive_os.sqlite

x-runtime-environment: &runtime-environment
  <<: *storage-environment
  COGNITIVE_ENV: production
  COGNITIVE_AUTH_ENABLED: "true"
  COGNITIVE_API_KEY: ${COGNITIVE_API_KEY:?Set in .env.container}
  COGNITIVE_JWT_SECRET: ${COGNITIVE_JWT_SECRET:?Set in .env.container}
  COGNITIVE_CORS_ORIGINS: ${COGNITIVE_CORS_ORIGINS:?Set in .env.container}
  COGNITIVE_CORS_METHODS: ${COGNITIVE_CORS_METHODS:-GET,POST,DELETE,OPTIONS}
  COGNITIVE_CORS_HEADERS: ${COGNITIVE_CORS_HEADERS:-Authorization,Content-Type,X-API-Key}
  COGNITIVE_TRUSTED_PROXIES: 172.28.0.2/32

x-app-base: &app-base
  <<: *app-image
  init: true
  user: "10001:10001"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  volumes:
    - cognitive-sqlite:/app/data
  stop_grace_period: 30s

services:
  migration:
    <<: *app-base
    command: ["migrate"]
    environment: *storage-environment
    network_mode: none
    restart: "no"

  core:
    <<: *app-base
    command: ["core"]
    environment: *runtime-environment
    expose:
      - "8000"
    networks:
      edge:
        ipv4_address: 172.28.0.3
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: cognitive-caddy:${COGNITIVE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Caddy.Dockerfile
    init: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run:rw,noexec,nosuid,nodev,size=16m
    environment:
      COGNITIVE_DOMAIN: ${COGNITIVE_DOMAIN:?Set in .env.container}
      CADDY_TLS_EMAIL: ${CADDY_TLS_EMAIL:?Set in .env.container}
      CADDY_INTERNAL_HTTP_PORT: ${CADDY_INTERNAL_HTTP_PORT:-8080}
      CADDY_INTERNAL_HTTPS_PORT: ${CADDY_INTERNAL_HTTPS_PORT:-8443}
    ports:
      - "${CADDY_HTTP_PORT:-80}:${CADDY_INTERNAL_HTTP_PORT:-8080}"
      - "${CADDY_HTTPS_PORT:-443}:${CADDY_INTERNAL_HTTPS_PORT:-8443}"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.28.0.2
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  integrity:
    <<: *app-base
    profiles: ["ops"]
    command: ["integrity"]
    environment: *storage-environment
    network_mode: none
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: "no"

  backup:
    <<: *app-base
    profiles: ["ops"]
    command: ["backup"]
    environment: *storage-environment
    network_mode: none
    depends_on:
      core:
        condition: service_healthy
    restart: "no"

  restore-candidate:
    <<: *app-base
    profiles: ["ops"]
    command: ["restore-candidate"]
    environment:
      <<: *storage-environment
      COGNITIVE_RESTORE_BACKUP: ${COGNITIVE_RESTORE_BACKUP:-}
    network_mode: none
    restart: "no"

  restore-activate:
    <<: *app-base
    profiles: ["ops"]
    command: ["restore-activate"]
    environment:
      <<: *storage-environment
      COGNITIVE_RESTORE_CANDIDATE: ${COGNITIVE_RESTORE_CANDIDATE:-}
    network_mode: none
    restart: "no"

volumes:
  cognitive-sqlite:
  caddy-data:
  caddy-config:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
