schema: archeaxis.execution-slice-blueprints/v1
schema_version: 1
plan_id: AAK-VNEXT-2026-09-04
program_graph_path: .project/TASK-GRAPH.yaml
non_authorizing: true
limits:
  max_files: 25
  max_effort_hours: 16
  max_elapsed_hours: 48
  max_execution_lanes: 1
  max_serial_resource_families: 1
materialization_rules:
  - Blueprints suggest behavior boundaries only and never authorize a write.
  - Materialize only the dependency-ready internal frontier and bind the current protected Program graph digest.
  - Derive exact paths, operations, gates, grants, machine requirements, artifact inputs and atom coverage immediately before issuance.
  - Split again whenever the forecast or actual diff crosses any limit; a slice cannot widen itself.
  - Product defects found by qualification slices return to a new implementation slice in the owning lane.
  - Every unlisted slice materializes as implementation; every qualification_no_diff slice materializes with an empty write scope and zero repository diff.
default_execution_mode: implementation
qualification_no_diff:
  execution_mode: qualification-no-diff
  repository_diff: zero-from-activation-to-subject-head
  repository_access: read-only
  outputs: job-scratch-or-external-attestation-only
  defect_handling: fail-or-block-and-issue-new-owning-lane-implementation-slice
  slice_refs:
