schema: archeaxis.task-graph/v1
schema_version: 1
document_kind: program-plan
project: ArcheAxis-Knowledge-OS
plan_id: AAK-VNEXT-2026-09-04
audit_base_sha: ce3c2de551bcaac52c8a26d012e6482c1a73a540
legacy_release_commit: c202c5b5a4789f0dc21accaa7ccbfed4676f0573
global_rules:
  max_files_per_issued_slice: 25
  max_estimated_effort_hours_per_issued_slice: 16
  max_duration_hours_per_issued_slice: 48
  program_node_is_not_automatically_an_issued_envelope: true
  split_task_id_pattern: <program-id>-S<nn>
  atom_reference_pattern: <program-id>:A<nn> or <program-id>:E<nn>
  atom_indexing: one-based declaration order, zero-padded to two digits; atom text is immutable within a signed graph revision
  required_skip_is_failure: true
  one_task_one_branch_worktree_agent: true
  vnext_database_writer: rust_writer_actor_only
  legacy_database_access: consistent_snapshot_then_read_only_export
  direct_main_push: forbidden
  public_release_requires_owner_confirmation: true
  final_receipt_is_exact_sha_ci_attestation: true
  repository_receipt_copy_requires_later_metadata_task: true
  canonical_repository_path: .project/TASK-GRAPH.yaml
  issued_envelope_path: .project/tasks/issued/<plan-id>/<task-id>/<issuance-id>.json
  issued_authority_grant_path: .project/leases/issued/<plan-id>/<task-id>/<issuance-id>/<grant-id>.json
  authority_revocation_path: .project/leases/revocations/<grant-id>.json
  canonical_digest_policy: docs/operations/digest-canonicalization.md
execution_slicing:
  materialization: just-in-time-from-protected-program-graph
  slice_blueprint_path: .project/EXECUTION-SLICE-BLUEPRINTS.yaml
  every_program_node_requires_one_or_more_issued_slices: true
  single_slice_candidates: [PR-00, PR-08, PR-09, PR-13, PR-14, PR-17, PR-18, PR-23, PR-25]
  task_trains: [PR-01, PR-02, PR-03, PR-04, PR-05, PR-06, PR-07, PR-10, PR-11, PR-12, PR-15, PR-16, PR-19, PR-20, PR-21, PR-22, PR-24, PR-26, PR-27, PR-28, PR-29, PR-30, PR-31, PR-32, PR-33A, PR-33B, PR-33C, PR-33D, PR-33E, PR-33F]
  closure_rule: every indexed acceptance and evidence atom must be covered by exact-SHA slice receipts
  over_limit_rule: split_even_when_listed_as_single_slice_candidate
  qualification_no_diff_policy:
    repository_diff: zero-from-activation-to-subject-head
    repository_access: read-only
    outputs: job-scratch-or-external-attestation-only
    defect_handling: fail-or-block-and-issue-new-owning-lane-implementation-slice
  pr31_minimum_slices: [preflight-freeze, candidate-a, candidate-b, aggregate-decision]
  pr32_strategy: digest-bound-approved-manifest-expansion-partitioned-to-25-exact-paths-plus-clean-clone-qualification
resource_gates:
  clean_windows_11: [PR-09, PR-24, PR-25, PR-30, PR-31]
  isolated_legacy_copy: [PR-26, PR-27, PR-31]
  explicit_network_and_credentials: [PR-21, PR-28, PR-29, PR-33D]
  rights_and_license_approval: [PR-21, PR-26, PR-28, PR-29, PR-33A, PR-33B, PR-33C, PR-33D, PR-33E, PR-33F]
  scheduling_rule: do_not_issue_or_hold_authority_grants_while_waiting_for_external_resources
default_execution_lane_by_task_kind:
  authority: owner
  governance: owner
  contracts: contract
  ci: ci
  ci-release: release
  rust: rust-core
  rust-contract: contract
  desktop: avalonia-ui
  python: python-worker
  quality: journey
  integration: journey
  qualification: journey
  packaging: release
  release: release
  legacy: migration
  migration: migration
  research: python-worker
  evaluation: journey
  retire: migration
  capability: python-worker
  search: rust-core
serial_zones:
  - AGENTS.md
  - PROJECT_CONTRACT.yaml
  - DIRECTORY_AUTHORITY.yaml
  - LEGACY_MANIFEST.yaml
  - DECISION_SUPERSESSION_LEDGER.yaml
  - .project/**
  - packages/contracts/**
  - crates/archeaxis-store-sqlite/migrations/**
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - global.json
  - Directory.Packages.props
  - "**/uv.lock"
  - .github/workflows/**
  - packaging/**/release-manifest*
  - reports/release/**
tasks:
  - task_id: PR-00
    priority: P0
    title: Owner 决策、G0 缩窄与 legacy 冻结
    task_kind: authority
    risk: R0
    depends_on: []
    allowed_paths: [PROJECT_CONTRACT.yaml, LEGACY_MANIFEST.yaml, DECISION_SUPERSESSION_LEDGER.yaml, docs/authority/**, docs/decisions/**, docs/LANGUAGE_BOUNDARY_AUTHORITY_INDEX.md]
