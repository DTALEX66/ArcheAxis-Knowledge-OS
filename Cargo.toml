[workspace]
resolver = "3"
# Legacy Tauri keeps its own lockfile and build boundary.
exclude = ["src-tauri", "desktop/src-tauri"]
members = [
    "crates/archeaxis-contracts",
    "crates/archeaxis-store-sqlite",
    "crates/archeaxis-domain",
    "crates/archeaxis-application",
    "crates/archeaxis-migration",
    "crates/archeaxis-sidecar-protocol",
    "crates/archeaxis-api",
    "crates/archeaxis-archive",
]
